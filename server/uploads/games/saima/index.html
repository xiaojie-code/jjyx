<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes"
    />
    <title>Saima</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: none;
        background: #000;
      }

      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        left: 0;
        top: 0;
        transform: none;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #231f20;
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }

      #unity-progress-text {
        margin-top: 10px;
        color: #fff;
        font: 13px/1.4 Arial, sans-serif;
        text-shadow: 0 1px 2px #000;
      }

      #unity-footer {
        display: none;
      }

      #unity-warning {
        position: absolute;
        left: 50%;
        top: 16px;
        max-width: calc(100% - 32px);
        transform: translateX(-50%);
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-progress-text">0%</div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-build-title">Saima</div>
        <div id="unity-fullscreen-button"></div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var progressText = document.querySelector("#unity-progress-text");
      var warningBanner = document.querySelector("#unity-warning");
      var appInitData = {};

      window.onAppMessage = function onAppMessage(message) {
        if (!message || message.action !== "init") return;
        appInitData = message.data || {};
        window.__SAIMA_APP_INIT__ = appInitData;
      };

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }

        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type === "error") {
          div.style = "background: #dc2626; color: white; padding: 10px;";
        } else {
          div.style = "background: #facc15; color: #111827; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGL.data.gz",
        frameworkUrl: buildUrl + "/WebGL.framework.js.gz",
        codeUrl: buildUrl + "/WebGL.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Unity",
        productName: "Saima",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
      } else {
        container.className = "unity-desktop";
      }

      loadingBar.style.display = "block";

      window.addEventListener("error", function (event) {
        console.error("[saima] window error:", event.message, event.filename, event.lineno);
      });
      window.addEventListener("unhandledrejection", function (event) {
        console.error("[saima] unhandled rejection:", event.reason);
      });

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var percent = Math.floor(100 * progress);
          progressBarFull.style.width = percent + "%";
          progressText.textContent = percent + "%";
        })
          .then(function (unityInstance) {
            loadingBar.style.display = "none";
            window.unityInstance = unityInstance;
            console.log("[saima] unity ready");
          })
          .catch(function (message) {
            console.error("[saima] unity failed:", message);
            unityShowBanner(message, "error");
          });
      };
      script.onerror = function () {
        unityShowBanner("Unable to load Unity loader.", "error");
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
