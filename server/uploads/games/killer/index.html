<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes"
    />
    <title>Killer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        left: 0;
        top: 0;
        transform: none;
      }

      #unity-canvas {
        display: block;
        width: min(100vw, calc(100vh * 750 / 1334));
        height: min(100vh, calc(100vw * 1334 / 750));
        max-width: 100vw;
        max-height: 100vh;
        background: #000;
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 4;
        transform: translate(-50%, -50%);
      }

      #unity-footer {
        display: none;
      }

      #unity-warning {
        position: absolute;
        left: 50%;
        top: 16px;
        z-index: 10;
        max-width: calc(100% - 32px);
        transform: translateX(-50%);
      }

      .killer-mode-panel,
      .killer-wait-panel {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(0, 0, 0, 0.78);
        color: #fff;
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }

      .killer-mode-panel {
        z-index: 20;
      }

      .killer-wait-panel {
        z-index: 18;
        text-align: center;
      }

      .killer-mode-panel[hidden],
      .killer-wait-panel[hidden],
      .killer-mode-badge[hidden] {
        display: none;
      }

      .killer-mode-dialog,
      .killer-wait-box {
        width: min(420px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        padding: 22px;
        background: rgba(18, 24, 38, 0.96);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.38);
      }

      .killer-wait-box {
        width: min(360px, 100%);
      }

      .killer-mode-title,
      .killer-wait-title {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }

      .killer-wait-title {
        font-size: 20px;
      }

      .killer-mode-subtitle,
      .killer-wait-text {
        margin: 0 0 18px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 14px;
        line-height: 1.5;
      }

      .killer-wait-text {
        margin-bottom: 0;
      }

      .killer-mode-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .killer-mode-button {
        min-height: 52px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 16px;
        font-weight: 700;
      }

      .killer-mode-button.is-active,
      .killer-mode-button:active {
        border-color: #f5c84c;
        background: #f5c84c;
        color: #16130a;
      }

      .killer-mode-badge {
        position: fixed;
        right: 10px;
        top: 10px;
        z-index: 12;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font: 12px/1 Arial, "Microsoft YaHei", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-mobile">
      <canvas id="unity-canvas" width="750" height="1334" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
      </div>
    </div>

    <div id="killer-mode-panel" class="killer-mode-panel" hidden>
      <div class="killer-mode-dialog">
        <h1 class="killer-mode-title">选择对战模式</h1>
        <p class="killer-mode-subtitle">AI 对战会加入机器人陪玩，真人对战只匹配 APP 内真实在线用户。</p>
        <div class="killer-mode-actions">
          <button class="killer-mode-button" type="button" data-killer-mode="ai">AI 对战</button>
          <button class="killer-mode-button" type="button" data-killer-mode="real">真人对战</button>
        </div>
      </div>
    </div>

    <div id="killer-mode-badge" class="killer-mode-badge" hidden></div>

    <div id="killer-wait-panel" class="killer-wait-panel" hidden>
      <div class="killer-wait-box">
        <h2 class="killer-wait-title">等待真人玩家</h2>
        <p id="killer-wait-text" class="killer-wait-text">当前只有 1 名玩家，至少 2 名真实玩家后开始对局。</p>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      var modePanel = document.querySelector("#killer-mode-panel");
      var modeBadge = document.querySelector("#killer-mode-badge");
      var waitPanel = document.querySelector("#killer-wait-panel");
      var waitText = document.querySelector("#killer-wait-text");
      var appInitData = {};
      var unityStarted = false;

      function normalizeKillerMode(mode) {
        var text = String(mode || "").toLowerCase();
        return text === "real" || text === "pvp" || text === "online" ? "real" : "ai";
      }

      function getKillerModeFromQuery() {
        var params = new URLSearchParams(window.location.search);
        var mode = params.get("mode") || params.get("matchMode") || params.get("gameMode");
        return mode ? normalizeKillerMode(mode) : "";
      }

      function getKillerMode() {
        return normalizeKillerMode(window.__KILLER_MODE__ || localStorage.getItem("killer_match_mode") || "ai");
      }

      function applyKillerModeToUrl(mode) {
        try {
          var url = new URL(window.location.href);
          url.searchParams.set("mode", normalizeKillerMode(mode));
          history.replaceState(null, "", url.toString());
        } catch (error) {}
      }

      function setKillerMode(mode) {
        window.__KILLER_MODE__ = normalizeKillerMode(mode);
        localStorage.setItem("killer_match_mode", window.__KILLER_MODE__);
        applyKillerModeToUrl(window.__KILLER_MODE__);
        modeBadge.textContent = window.__KILLER_MODE__ === "real" ? "真人对战" : "AI 对战";
        modeBadge.hidden = false;
      }

      function showWaiting(info) {
        if (getKillerMode() !== "real") return;
        var online = info && typeof info.online !== "undefined" ? info.online : 1;
        var minPlayers = info && info.min_players ? info.min_players : 2;
        waitText.textContent = "当前 " + online + " 名玩家，至少 " + minPlayers + " 名真实玩家后开始对局。";
        waitPanel.hidden = false;
      }

      function hideWaiting() {
        waitPanel.hidden = true;
      }

      function injectKillerMode(payload) {
        if (typeof payload !== "string") return payload;
        try {
          var message = JSON.parse(payload);
          var action = message && message.action;
          var actions = ["enterroom", "touzhu", "changesmallroom", "leaveroom", "getrecord"];
          if (actions.indexOf(action) === -1) return payload;
          if (!message.data || typeof message.data !== "object") {
            message.data = {};
          }
          message.data.mode = getKillerMode();
          return JSON.stringify(message);
        } catch (error) {
          return payload;
        }
      }

      function handleKillerSocketMessage(event) {
        if (typeof event.data !== "string") return;
        try {
          var message = JSON.parse(event.data);
          var action = message && message.action;
          var data = (message && message.data) || {};
          var info = data.info || {};
          if (action === "match_waiting") {
            showWaiting(info);
            return;
          }
          if (action === "returnenterroom" && info.mode === "real" && info.match_status === "waiting") {
            showWaiting(info);
            return;
          }
          if (action === "returnenterroom" && info.mode === "real" && info.match_status === "playing") {
            hideWaiting();
            return;
          }
          if (["game_start", "killerappear", "result"].indexOf(action) !== -1) {
            hideWaiting();
          }
        } catch (error) {}
      }

      window.onAppMessage = function onAppMessage(message) {
        if (!message || message.action !== "init") return;
        appInitData = message.data || {};
        window.__KILLER_APP_INIT__ = appInitData;
      };

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }

        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type === "error") {
          div.style = "background: #dc2626; color: white; padding: 10px;";
        } else {
          div.style = "background: #facc15; color: #111827; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      function appendKillerModeToWebSocketUrl(url) {
        var mode = getKillerMode();
        try {
          var wsUrl = new URL(String(url), window.location.href);
          wsUrl.searchParams.set("mode", mode);
          return wsUrl.toString();
        } catch (error) {
          var text = String(url || "");
          var glue = text.indexOf("?") === -1 ? "?" : "&";
          return text + glue + "mode=" + encodeURIComponent(mode);
        }
      }

      function resolveWebSocketUrl() {
        var params = new URLSearchParams(window.location.search);
        var explicitUrl = params.get("ws") || params.get("wsUrl");
        if (explicitUrl) return appendKillerModeToWebSocketUrl(explicitUrl);

        var protocol = params.get("wsProtocol") || (location.protocol === "https:" ? "wss:" : "ws:");
        var host = params.get("wsHost") || location.hostname || "127.0.0.1";
        var port = params.get("wsPort") || "7272";
        return appendKillerModeToWebSocketUrl(protocol + "//" + host + (port ? ":" + port : ""));
      }

      function rewriteKillerWebSocketUrl(url) {
        var text = String(url || "");
        if (!/gamesocket\.wanyouyinqing\.com/i.test(text)) {
          return appendKillerModeToWebSocketUrl(url);
        }

        var rewritten = resolveWebSocketUrl();
        console.log("[killer] rewrite websocket:", text, "=>", rewritten);
        return rewritten;
      }

      (function installKillerWebSocketPatch() {
        if (!window.WebSocket || window.__KILLER_WEBSOCKET_PATCHED__) return;

        var NativeWebSocket = window.WebSocket;

        function PatchedWebSocket(url, protocols) {
          var rewrittenUrl = rewriteKillerWebSocketUrl(url);
          var socket =
            protocols === undefined
              ? new NativeWebSocket(rewrittenUrl)
              : new NativeWebSocket(rewrittenUrl, protocols);
          var nativeSend = socket.send;
          socket.send = function patchedSend(payload) {
            return nativeSend.call(socket, injectKillerMode(payload));
          };
          socket.addEventListener("message", handleKillerSocketMessage);
          return socket;
        }

        PatchedWebSocket.prototype = NativeWebSocket.prototype;
        ["CONNECTING", "OPEN", "CLOSING", "CLOSED"].forEach(function (key) {
          Object.defineProperty(PatchedWebSocket, key, {
            configurable: true,
            enumerable: true,
            value: NativeWebSocket[key],
          });
        });
        try {
          Object.setPrototypeOf(PatchedWebSocket, NativeWebSocket);
        } catch (error) {}

        window.WebSocket = PatchedWebSocket;
        window.__KILLER_WEBSOCKET_PATCHED__ = true;
      })();

      function startUnity() {
        if (unityStarted) return;
        unityStarted = true;
        modePanel.hidden = true;

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/WebGLBuild.loader.js";
        var config = {
          dataUrl: buildUrl + "/WebGLBuild.data.unityweb",
          frameworkUrl: buildUrl + "/WebGLBuild.framework.js.unityweb",
          codeUrl: buildUrl + "/WebGLBuild.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "wanyouyinqing",
          productName: "dataosha",
          productVersion: "0.1",
          websocket: {
            url: resolveWebSocketUrl(),
          },
          showBanner: unityShowBanner,
        };

        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            progressBarFull.style.width = 100 * progress + "%";
          })
            .then(function (unityInstance) {
              loadingBar.style.display = "none";
              window.unityInstance = unityInstance;
            })
            .catch(function (message) {
              unityShowBanner(message, "error");
            });
        };
        document.body.appendChild(script);
      }

      function showModeEntry() {
        var queryMode = getKillerModeFromQuery();
        if (queryMode) {
          setKillerMode(queryMode);
          startUnity();
          return;
        }

        setKillerMode(localStorage.getItem("killer_match_mode") || "ai");
        Array.prototype.forEach.call(modePanel.querySelectorAll("[data-killer-mode]"), function (button) {
          var mode = normalizeKillerMode(button.getAttribute("data-killer-mode"));
          button.classList.toggle("is-active", mode === getKillerMode());
          button.addEventListener("click", function () {
            setKillerMode(mode);
            startUnity();
          });
        });
        modePanel.hidden = false;
      }

      showModeEntry();
    </script>
  </body>
</html>
