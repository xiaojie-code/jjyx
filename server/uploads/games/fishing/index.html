<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>Cocos Creator | fishing</title>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->
  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- force webkit on 360 -->
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <!-- force edge on IE -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">

  <!-- force full screen on some browser -->
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  
  <!-- force screen orientation on some browser -->
  <meta name="screen-orientation" content=""/>
  <meta name="x5-orientation" content="">

  <!--fix fireball/issues/3568 -->
  <!--<meta name="browsermode" content="application">-->
  <meta name="x5-page-mode" content="app">

  <!--<link rel="apple-touch-icon" href=".png" />-->
  <!--<link rel="apple-touch-icon-precomposed" href=".png" />-->

  <link rel="stylesheet" type="text/css" href="style-mobile.25fc5.css?v=20260615-fullscreen"/>
  <link rel="icon" href="favicon.8de18.ico"/>
  <script>
    // H5 平台适配
    window.GamePlatform = window.GamePlatform || {};
    window.GamePlatform.H5 = 'H5';
    window.GamePlatform.weixin = 'weixin';
    window.GamePlatform.VIVO = 'VIVO';
    window.GamePlatform.zijietiaodong = 'zijietiaodong';
    window.GamePlatform.baidu = 'baidu';
    window.GamePlatform.QQ = 'QQ';
    window.GamePlatform.primordial = 'primordial';
    window.CC_PLATFORM = 'H5';

    // 确保本地有存档数据（防止首次进入时装备为 null 报错）
    // 游戏会从 localStorage 的 user_local_save_item 读取存档
    // 如果没有存档，loadUserSaveData 会创建默认装备
    // 但需要确保在 updateGameUIView 之前完成
    // 这里不预设数据，让游戏自己的 loadUserSaveData 处理
  </script>
</head>
<body>
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes">
      <span style="width: 0%"></span>
    </div>
  </div>

<script>
  (function () {
    var ACTIVE_SAVE_KEY = "user_local_save_item";
    var ACTIVE_SAVE_OWNER_KEY = "fishing_active_account";
    var appInitData = getInitialAppData();
    var pendingGold = null;
    var suppressGoldSync = false;
    var installed = false;
    var textPatchInstalled = false;
    var adPatchInstalled = false;
    var lastKnownGold = null;
    var nextGoldChangeReason = "";
    var lastAccountIdentity = "";
    var saveStoragePatched = false;
    var nativeStorageGetItem = null;
    var nativeStorageSetItem = null;
    var nativeStorageRemoveItem = null;
    var remoteSaveLoaded = false;
    var remoteSaveData = null;
    var suppressSaveUpload = false;
    var saveUploadTimer = null;
    var economyPatchInstalled = false;
    var ECONOMY_VERSION = 5;
    var FISHING_ENTRY_FEE = 100;
    var fishingEntryState = "idle";
    var fishingEntryRequestId = "";
    var fishingEntryOverlay = null;

    function fitCocosCanvasToViewport() {
      var width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth || 0;
      var height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight || 0;
      if (!width || !height) return;
      var container = document.getElementById("Cocos2dGameContainer");
      var canvas = document.getElementById("GameCanvas");
      [document.documentElement, document.body, container, canvas].forEach(function (node) {
        if (!node || !node.style) return;
        node.style.width = width + "px";
        node.style.height = height + "px";
        node.style.margin = "0";
        node.style.padding = "0";
        if (node === container || node === canvas) {
          node.style.left = "0";
          node.style.top = "0";
        }
      });
      try {
        if (window.cc && cc.view) {
          cc.view.setFrameSize(width, height);
          cc.view.resizeWithBrowserSize(true);
        }
      } catch (_) {}
    }

    function getInitialAppData() {
      try {
        if (window.__GAME_APP_INIT__) return window.__GAME_APP_INIT__;
        if (window.__APP_GAME_INIT_MESSAGE__ && window.__APP_GAME_INIT_MESSAGE__.data) {
          return window.__APP_GAME_INIT_MESSAGE__.data;
        }
      } catch (error) {}
      return {};
    }

    function toNumber(value) {
      var num = Number(value);
      return isFinite(num) ? num : 0;
    }

    function postGameMessage(action, data) {
      try {
        if (
          window.flutter_inappwebview &&
          typeof window.flutter_inappwebview.callHandler === "function"
        ) {
          window.flutter_inappwebview.callHandler(
            "gameMessage",
            JSON.stringify({ action: action, data: data || {} })
          );
        }
      } catch (error) {
        console.warn("[fishing] app bridge failed:", error);
      }
    }

    function syncGoldDelta(delta, reason) {
      if (!delta) return;
      postGameMessage("changePoints", {
        amount: delta,
        reason: reason || (delta > 0 ? "fishing_points_earn" : "fishing_points_spend"),
      });
    }

    function scaleEconomyValue(value) {
      var num = toNumber(value);
      if (num <= 0) return 0;
      if (num < 100) return Math.max(1, Math.floor(num));
      return Math.max(10, Math.floor(num / 100) * 10);
    }

    var FISH_REWARD_MAX_POINTS = 500;

    function capFishRewardValue(value) {
      return Math.min(FISH_REWARD_MAX_POINTS, value);
    }

    function scaleFishRewardValue(value) {
      var num = toNumber(value);
      if (num <= 0) return 0;
      if (num < 100) return capFishRewardValue(Math.max(1, Math.floor(num)));
      if (num >= 10000) return capFishRewardValue(Math.max(100, Math.floor(num / 100)));
      return capFishRewardValue(Math.max(10, Math.floor(num / 10)));
    }

    function normalizeStoredFishRewardValue(value) {
      var num = toNumber(value);
      if (num <= 0) return 0;
      if (num < 1000) return capFishRewardValue(Math.floor(num));
      return scaleFishRewardValue(num);
    }

    function shouldPreserveFishingLevelField(key) {
      var normalized = String(key || "").toLowerCase();
      return /(^|_)(skill|bait|net|craft|rod|hook|rope).*(_|)(lv|level)$/.test(normalized) ||
        /(skill|bait|net|craft|rod|hook|rope).*(lv|level)/.test(normalized) ||
        /^lv(el)?$/.test(normalized);
    }

    function mergeFishingProgress(prev, next, key) {
      if (Array.isArray(prev) && Array.isArray(next)) {
        return next.map(function (item, index) {
          return mergeFishingProgress(prev[index], item, key);
        });
      }
      if (prev && next && typeof prev === "object" && typeof next === "object" && !Array.isArray(prev) && !Array.isArray(next)) {
        var merged = Object.assign({}, next);
        Object.keys(prev).forEach(function (childKey) {
          if (Object.prototype.hasOwnProperty.call(next, childKey)) {
            merged[childKey] = mergeFishingProgress(prev[childKey], next[childKey], childKey);
          }
        });
        return merged;
      }
      if (shouldPreserveFishingLevelField(key)) {
        var prevNumber = Number(prev);
        var nextNumber = Number(next);
        if (isFinite(prevNumber) && isFinite(nextNumber) && prevNumber > nextNumber) {
          return prev;
        }
      }
      return next;
    }

    function hasRealAccountData() {
      return !!(appInitData && (appInitData.userId || appInitData.account || appInitData.token));
    }

    function getAccountIdentity() {
      if (!hasRealAccountData()) return "";
      return String(appInitData.userId || appInitData.account || appInitData.token)
        .replace(/[^a-zA-Z0-9_.-]/g, "_");
    }

    function getScopedSaveKey() {
      var account = getAccountIdentity();
      return account ? ACTIVE_SAVE_KEY + ":" + account : "";
    }

    function activateAccountSave() {
      var scopedKey = getScopedSaveKey();
      if (!scopedKey || scopedKey === lastAccountIdentity) return;
      var account = getAccountIdentity();
      var scopedSave = localStorage.getItem(scopedKey);
      if (scopedSave) {
        localStorage.setItem(ACTIVE_SAVE_KEY, scopedSave);
      } else {
        var activeOwner = localStorage.getItem(ACTIVE_SAVE_OWNER_KEY);
        var activeSave = localStorage.getItem(ACTIVE_SAVE_KEY);
        if (activeSave && (!activeOwner || activeOwner === account)) {
          localStorage.setItem(scopedKey, activeSave);
        } else {
          localStorage.removeItem(ACTIVE_SAVE_KEY);
        }
      }
      if (account) {
        localStorage.setItem(ACTIVE_SAVE_OWNER_KEY, account);
      }
      lastAccountIdentity = scopedKey;
    }

    function mirrorActiveSaveToAccount() {
      var scopedKey = getScopedSaveKey();
      if (!scopedKey) return;
      var raw = localStorage.getItem(ACTIVE_SAVE_KEY);
      if (raw) {
        localStorage.setItem(scopedKey, raw);
        localStorage.setItem(ACTIVE_SAVE_OWNER_KEY, getAccountIdentity());
      }
    }

    function getTodayString() {
      var now = new Date();
      var y = now.getFullYear();
      var m = String(now.getMonth() + 1).padStart(2, "0");
      var d = String(now.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + d;
    }

    function dailyRewardKey() {
      var account = getAccountIdentity() || "guest";
      return "fishing_daily_login_reward:" + account + ":" + getTodayString();
    }

    function balanceFromData(data, fallback) {
      if (typeof data.points !== "undefined") return data.points;
      if (typeof data.balance !== "undefined") return data.balance;
      if (typeof data.coin !== "undefined") return data.coin;
      return typeof fallback !== "undefined" ? fallback : 0;
    }

    function exitFishingGame() {
      postGameMessage("exitGame", { source: "fishing_entry_fee" });
    }

    function ensureFishingEntryOverlay() {
      if (fishingEntryOverlay) return fishingEntryOverlay;
      var overlay = document.createElement("div");
      overlay.id = "fishing-entry-fee-overlay";
      overlay.style.cssText = [
        "position:fixed",
        "inset:0",
        "z-index:2147483647",
        "display:none",
        "align-items:center",
        "justify-content:center",
        "padding:24px",
        "background:rgba(8,18,32,.56)",
        "backdrop-filter:blur(8px)",
        "-webkit-backdrop-filter:blur(8px)",
        "box-sizing:border-box"
      ].join(";");
      overlay.innerHTML =
        '<div style="width:min(360px,92vw);border-radius:22px;padding:22px 20px 18px;color:#17314a;background:linear-gradient(180deg,#ffffff 0%,#eef8ff 100%);box-shadow:0 18px 48px rgba(4,20,38,.34);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;text-align:center;">' +
          '<div data-role="icon" style="width:56px;height:56px;margin:0 auto 12px;border-radius:18px;background:linear-gradient(135deg,#22c1c3,#2f80ed);display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:800;box-shadow:0 10px 22px rgba(47,128,237,.28);">¥</div>' +
          '<div data-role="title" style="font-size:21px;font-weight:800;line-height:1.2;margin-bottom:8px;">入场费用</div>' +
          '<div data-role="message" style="font-size:15px;line-height:1.65;color:#52677a;margin:0 auto 18px;"></div>' +
          '<div data-role="actions" style="display:flex;gap:10px;justify-content:center;"></div>' +
        '</div>';
      document.body.appendChild(overlay);
      fishingEntryOverlay = overlay;
      return overlay;
    }

    function showFishingEntryDialog(title, message, actions) {
      var overlay = ensureFishingEntryOverlay();
      overlay.querySelector('[data-role="title"]').textContent = title;
      overlay.querySelector('[data-role="message"]').innerHTML = message;
      var actionsNode = overlay.querySelector('[data-role="actions"]');
      actionsNode.innerHTML = "";
      (actions || []).forEach(function (action) {
        var button = document.createElement("button");
        button.type = "button";
        button.textContent = action.text;
        button.style.cssText = [
          "min-width:118px",
          "height:42px",
          "border:0",
          "border-radius:999px",
          "font-size:15px",
          "font-weight:700",
          "color:" + (action.primary === false ? "#2f668c" : "#fff"),
          "background:" + (action.primary === false ? "#dcecf8" : "linear-gradient(135deg,#18b7c8,#2f80ed)"),
          "box-shadow:" + (action.primary === false ? "none" : "0 10px 22px rgba(47,128,237,.25)")
        ].join(";");
        button.onclick = function () {
          if (typeof action.onClick === "function") action.onClick();
        };
        actionsNode.appendChild(button);
      });
      overlay.style.display = "flex";
    }

    function hideFishingEntryDialog() {
      if (fishingEntryOverlay) fishingEntryOverlay.style.display = "none";
    }

    function isFishingHomeReady() {
      if (!hasRealAccountData()) return false;
      if (fishingEntryState !== "idle") return false;
      var splash = document.getElementById("splash");
      if (splash) {
        var style = window.getComputedStyle ? window.getComputedStyle(splash) : splash.style;
        if (style && style.display !== "none" && style.visibility !== "hidden" && style.opacity !== "0") {
          return false;
        }
      }
      try {
        if (!window.cc || !cc.director || !cc.director.getScene || !cc.director.getScene()) return false;
      } catch (error) {
        return false;
      }
      return pendingGold !== null || lastKnownGold !== null;
    }

    function requestFishingEntryFee() {
      var balance = Math.floor(toNumber(pendingGold !== null ? pendingGold : lastKnownGold));
      if (balance < FISHING_ENTRY_FEE) {
        fishingEntryState = "blocked";
        showFishingEntryDialog(
          "积分不足",
          "当前积分不足 100，暂时无法进入实况钓鱼。<br>请补足积分后再试。",
          [{ text: "返回", primary: true, onClick: exitFishingGame }]
        );
        return;
      }

      fishingEntryState = "pending";
      fishingEntryRequestId = "fishing_entry_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
      showFishingEntryDialog(
        "入场费用",
        "进入实况钓鱼将扣除 <b style=\"color:#0d86d8;\">100 积分</b>。<br>当前积分：" + balance,
        [
          { text: "返回", primary: false, onClick: exitFishingGame },
          {
            text: "确认进入",
            primary: true,
            onClick: function () {
              showFishingEntryDialog("处理中", "正在扣除入场费用，请稍等。", []);
              postGameMessage("changePoints", {
                amount: -FISHING_ENTRY_FEE,
                reason: "fishing_entry",
                requestId: fishingEntryRequestId,
                module: "fishing"
              });
            }
          }
        ]
      );
    }

    function maybeShowFishingEntryFee() {
      if (!isFishingHomeReady()) return;
      requestFishingEntryFee();
    }

    function handleFishingEntryFeeResult(data) {
      if (!data || !fishingEntryRequestId || data.requestId !== fishingEntryRequestId) return false;
      var balance = balanceFromData(data, pendingGold || lastKnownGold || 0);
      refreshFishingGold(balance);
      if (data.success === false) {
        fishingEntryState = "failed";
        showFishingEntryDialog(
          "扣除失败",
          (data.message || "入场费用扣除失败，请稍后再试。") + "<br>当前积分：" + Math.floor(toNumber(balance)),
          [
            { text: "返回", primary: false, onClick: exitFishingGame },
            { text: "重试", primary: true, onClick: requestFishingEntryFee }
          ]
        );
        return true;
      }
      fishingEntryState = "charged";
      showFishingEntryDialog(
        "入场成功",
        "已扣除 <b style=\"color:#0d86d8;\">100 积分</b> 入场费用。<br>当前积分：" + Math.floor(toNumber(balance)),
        [{ text: "开始游戏", primary: true, onClick: hideFishingEntryDialog }]
      );
      return true;
    }

    function getQueryParam(name) {
      try {
        return new URLSearchParams(window.location.search || "").get(name);
      } catch (error) {
        return "";
      }
    }

    function getGameId() {
      return Math.floor(toNumber(
        appInitData.gameId ||
        appInitData.game_id ||
        getQueryParam("gameId") ||
        getQueryParam("game_id")
      ));
    }

    function getAuthToken() {
      return String(appInitData.token || appInitData.accessToken || appInitData.access_token || "");
    }

    function getApiBaseUrl() {
      var value = appInitData.apiBaseUrl || appInitData.api_base_url || getQueryParam("apiBaseUrl") || "";
      return String(value || "").replace(/\/+$/, "");
    }

    function getApiPath(suffix) {
      var gameId = getGameId();
      if (!gameId) return "";
      var path = "/api/game/" + gameId + suffix;
      var baseUrl = getApiBaseUrl();
      if (baseUrl && window.location.protocol === "file:") return baseUrl + path;
      return path;
    }

    function rawGetItem(key) {
      var getter = nativeStorageGetItem || Storage.prototype.getItem;
      return getter.call(localStorage, key);
    }

    function rawSetItem(key, value) {
      var setter = nativeStorageSetItem || Storage.prototype.setItem;
      return setter.call(localStorage, key, value);
    }

    function rawRemoveItem(key) {
      var remover = nativeStorageRemoveItem || Storage.prototype.removeItem;
      return remover.call(localStorage, key);
    }

    function migrateFishingSaveEconomy(save) {
      if (!save || typeof save !== "object" || save.__jjyxEconomyVersion === ECONOMY_VERSION) {
        return false;
      }
      if (save.fishBoxInfo && Array.isArray(save.fishBoxInfo.items)) {
        save.fishBoxInfo.items.forEach(function (item) {
          if (item && typeof item.price !== "undefined") {
            item.price = normalizeStoredFishRewardValue(item.price);
          }
        });
      }
      save.__jjyxEconomyVersion = ECONOMY_VERSION;
      return true;
    }

    function migrateStoredFishingSave(key) {
      if (!key) return false;
      try {
        var raw = rawGetItem(key);
        if (!raw) return false;
        var save = JSON.parse(raw);
        if (!migrateFishingSaveEconomy(save)) return false;
        rawSetItem(key, JSON.stringify(save));
        return true;
      } catch (error) {
        console.warn("[fishing] economy save migration failed:", error);
        return false;
      }
    }

    function migrateActiveFishingSaveEconomy() {
      var changed = migrateStoredFishingSave(ACTIVE_SAVE_KEY);
      var scopedKey = getScopedSaveKey();
      if (scopedKey) changed = migrateStoredFishingSave(scopedKey) || changed;
      return changed;
    }

    function unwrapApiResponse(payload) {
      if (payload && typeof payload === "object" && Object.prototype.hasOwnProperty.call(payload, "data")) {
        return payload.data;
      }
      return payload;
    }

    function sendApiJsonSync(method, path, body) {
      var token = getAuthToken();
      if (!path || !token || !window.XMLHttpRequest) return null;
      try {
        var xhr = new XMLHttpRequest();
        xhr.open(method, path, false);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.setRequestHeader("Accept", "application/json");
        xhr.setRequestHeader("Authorization", "Bearer " + token);
        xhr.send(body ? JSON.stringify(body) : null);
        if (xhr.status < 200 || xhr.status >= 300) {
          console.warn("[fishing] api sync failed:", method, path, xhr.status, xhr.responseText);
          return null;
        }
        var parsed = xhr.responseText ? JSON.parse(xhr.responseText) : null;
        if (parsed && typeof parsed.code !== "undefined" && parsed.code !== 0) {
          console.warn("[fishing] api sync code failed:", parsed);
          return null;
        }
        return unwrapApiResponse(parsed);
      } catch (error) {
        console.warn("[fishing] api sync error:", method, path, error);
        return null;
      }
    }

    function sendApiJsonAsync(method, path, body) {
      var token = getAuthToken();
      if (!path || !token || !window.fetch) return Promise.resolve(null);
      return fetch(path, {
        method: method,
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json",
          "Authorization": "Bearer " + token,
        },
        body: body ? JSON.stringify(body) : undefined,
      }).then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      }).then(function (payload) {
        if (payload && typeof payload.code !== "undefined" && payload.code !== 0) {
          throw new Error(payload.message || "api failed");
        }
        return unwrapApiResponse(payload);
      }).catch(function (error) {
        console.warn("[fishing] api async error:", method, path, error);
        return null;
      });
    }

    function markDailyRewardLocal(amount, balance, duplicate) {
      var key = dailyRewardKey();
      rawSetItem(key, JSON.stringify({
        account: getAccountIdentity() || "guest",
        date: getTodayString(),
        amount: Math.max(0, Math.floor(toNumber(amount))),
        balance: Math.max(0, Math.floor(toNumber(balance))),
        duplicate: !!duplicate,
        claimedAt: new Date().toISOString(),
      }));
    }

    function clearDailyRewardLocalIfNeeded(dailyClaimed) {
      if (!dailyClaimed) {
        rawRemoveItem(dailyRewardKey());
      }
    }

    function updateLocalSaveGold(gold) {
      try {
        var raw = localStorage.getItem("user_local_save_item");
        if (!raw) return;
        var save = JSON.parse(raw);
        save.gold = Math.max(0, Math.floor(toNumber(gold)));
        localStorage.setItem("user_local_save_item", JSON.stringify(save));
        mirrorActiveSaveToAccount();
      } catch (error) {
        console.warn("[fishing] update local save failed:", error);
      }
    }

    function normalizeSaveForRuntime(saveData, balance, dailyClaimed) {
      if (!saveData || typeof saveData !== "object") return null;
      var save = JSON.parse(JSON.stringify(saveData));
      if (typeof balance !== "undefined" && balance !== null) {
        save.gold = Math.max(0, Math.floor(toNumber(balance)));
      }
      if (dailyClaimed === true) {
        save.isGetGold = true;
        save.fishingDailyRewardDate = getTodayString();
      } else if (dailyClaimed === false && save.fishingDailyRewardDate !== getTodayString()) {
        save.isGetGold = false;
      }
      migrateFishingSaveEconomy(save);
      return save;
    }

    function writeActiveSaveFromRemote(saveData, balance, dailyClaimed) {
      var save = normalizeSaveForRuntime(saveData, balance, dailyClaimed);
      if (!save) return null;
      suppressSaveUpload = true;
      try {
        rawSetItem(ACTIVE_SAVE_KEY, JSON.stringify(save));
        mirrorActiveSaveToAccount();
      } finally {
        suppressSaveUpload = false;
      }
      return save;
    }

    function applySaveToGame(saveData) {
      if (!saveData || !window.UserBaseInfo || typeof window.UserBaseInfo.ChangeUserBaseInfoFormat !== "function") {
        return;
      }
      suppressGoldSync = true;
      suppressSaveUpload = true;
      try {
        window.UserBaseInfo.ChangeUserBaseInfoFormat(saveData);
        if (typeof window.UserBaseInfo.saveUserInfoData === "function") {
          window.UserBaseInfo.saveUserInfoData(true);
        }
        var canvas = window.cc && cc.director && cc.director.getScene()
          ? cc.director.getScene().getChildByName("Canvas")
          : null;
        if (canvas) {
          canvas.emit("updateGameView");
        }
      } catch (error) {
        console.warn("[fishing] apply save failed:", error);
      } finally {
        suppressSaveUpload = false;
        suppressGoldSync = false;
      }
    }

    function loadRemoteSaveSync(force) {
      if (remoteSaveLoaded && !force) return remoteSaveData;
      remoteSaveLoaded = true;
      var path = getApiPath("/save");
      var data = sendApiJsonSync("GET", path);
      if (!data) return remoteSaveData;

      pendingGold = Math.max(0, Math.floor(toNumber(balanceFromData(data, pendingGold || 0))));
      lastKnownGold = pendingGold;
      clearDailyRewardLocalIfNeeded(data.dailyClaimed === true);
      if (data.dailyClaimed === true) {
        markDailyRewardLocal(0, pendingGold, true);
      }

      if (data.saveData) {
        remoteSaveData = writeActiveSaveFromRemote(data.saveData, pendingGold, data.dailyClaimed === true);
        return remoteSaveData;
      }

      updateLocalSaveGold(pendingGold);
      return remoteSaveData;
    }

    function uploadActiveSave(rawValue) {
      if (suppressSaveUpload) return;
      var path = getApiPath("/save");
      if (!path || !getAuthToken()) return;
      if (!remoteSaveLoaded || pendingGold === null) return;
      var saveData = null;
      try {
        saveData = typeof rawValue === "string" ? JSON.parse(rawValue) : rawValue;
      } catch (error) {
        console.warn("[fishing] parse save for upload failed:", error);
        return;
      }
      if (!saveData || typeof saveData !== "object") return;
      if (remoteSaveData) {
        saveData = mergeFishingProgress(remoteSaveData, saveData);
      }

      if (saveUploadTimer) clearTimeout(saveUploadTimer);
      saveUploadTimer = setTimeout(function () {
        sendApiJsonAsync("POST", path, { saveData: saveData }).then(function (data) {
          if (!data) return;
          var balance = balanceFromData(data, pendingGold || saveData.gold || 0);
          pendingGold = Math.max(0, Math.floor(toNumber(balance)));
          lastKnownGold = pendingGold;
          if (data.saveData) {
            remoteSaveData = writeActiveSaveFromRemote(data.saveData, pendingGold, data.dailyClaimed === true);
          }
        });
      }, 900);
    }

    function installSaveStoragePatch() {
      if (saveStoragePatched || !window.Storage || !Storage.prototype) return;
      saveStoragePatched = true;
      nativeStorageGetItem = Storage.prototype.getItem;
      nativeStorageSetItem = Storage.prototype.setItem;
      nativeStorageRemoveItem = Storage.prototype.removeItem;

      Storage.prototype.getItem = function patchedGetItem(key) {
        if (this === localStorage && key === ACTIVE_SAVE_KEY) {
          loadRemoteSaveSync(false);
        }
        return nativeStorageGetItem.apply(this, arguments);
      };

      Storage.prototype.setItem = function patchedSetItem(key, value) {
        var result = nativeStorageSetItem.apply(this, arguments);
        if (this === localStorage && key === ACTIVE_SAVE_KEY) {
          mirrorActiveSaveToAccount();
          uploadActiveSave(value);
        }
        return result;
      };
    }

    function normalizeGameText(value) {
      if (typeof value !== "string") return value;
      return value
        .replace(/游客用户/g, "用户")
        .replace(/游戏币|金币|金幣|钻石|鑽石|蓝钻|藍鑽|好运币|好運幣|劳动力星|劳动星/g, "积分")
        .replace(/获取积分/g, "获取积分");
    }

    function walkNode(node, visitor) {
      if (!node) return;
      visitor(node);
      var children = node.children || [];
      for (var i = 0; i < children.length; i++) {
        walkNode(children[i], visitor);
      }
    }

    function hideNode(node) {
      if (node) node.active = false;
    }

    function hideAdRewardNode(labelNode) {
      var current = labelNode;
      for (var i = 0; i < 4 && current; i++) {
        if (cc.Button && typeof current.getComponent === "function" && current.getComponent(cc.Button)) {
          hideNode(current);
          return;
        }
        current = current.parent;
      }
    }

    function getNodeLabelText(node) {
      var parts = [];
      walkNode(node, function (child) {
        if (!child || typeof child.getComponent !== "function" || !cc.Label) return;
        var label = child.getComponent(cc.Label);
        if (label && typeof label.string !== "undefined") {
          parts.push(String(label.string || ""));
        }
      });
      return parts.join(" ");
    }

    function getButtonEventText(button) {
      var parts = [];
      try {
        (button.clickEvents || []).forEach(function (event) {
          parts.push(String(event.handler || ""));
          parts.push(String(event.customEventData || ""));
        });
      } catch (_) {}
      return parts.join(" ");
    }

    function patchGarbageDialogButtons(view) {
      if (!view || !view.select_op_node) return;
      var selectNode = view.select_op_node;
      var identifyButton = null;
      var discardButton = null;

      walkNode(selectNode, function (node) {
        if (!node || typeof node.getComponent !== "function" || !cc.Button) return;
        var button = node.getComponent(cc.Button);
        if (!button) return;
        var name = String(node.name || "").toLowerCase();
        var text = getNodeLabelText(node);
        var eventText = getButtonEventText(button);
        if (
          text.indexOf("鉴定") >= 0 ||
          eventText.indexOf("onSeePrice") >= 0 ||
          name.indexOf("see") >= 0 ||
          name.indexOf("price") >= 0 ||
          name.indexOf("video") >= 0 ||
          name.indexOf("identify") >= 0 ||
          name.indexOf("appraisal") >= 0
        ) {
          identifyButton = node;
        }
        if (
          text.indexOf("丢弃") >= 0 ||
          eventText.indexOf("onDiscard") >= 0 ||
          name.indexOf("discard") >= 0 ||
          name.indexOf("drop") >= 0
        ) {
          discardButton = node;
        }
      });

      if (!discardButton && identifyButton) {
        var buttons = [];
        walkNode(selectNode, function (node) {
          if (!node || node === identifyButton || typeof node.getComponent !== "function" || !cc.Button) return;
          if (node.getComponent(cc.Button)) buttons.push(node);
        });
        discardButton = buttons[0] || null;
      }

      if (identifyButton) {
        identifyButton.active = false;
      }
      if (discardButton) {
        discardButton.active = true;
        try {
          var layout = selectNode.getComponent && selectNode.getComponent(cc.Layout);
          if (layout) layout.enabled = false;
        } catch (_) {}
        discardButton.x = 0;
        if (typeof discardButton.setPosition === "function") {
          discardButton.setPosition(cc.v2(0, discardButton.y || 0));
        }
      }
      if (view.sell_op_node) {
        view.sell_op_node.active = false;
      }
    }

    function patchFishingGarbageDialog() {
      if (!window.cc || !cc.director) return;
      var scene = cc.director.getScene && cc.director.getScene();
      if (!scene) return;
      walkNode(scene, function (node) {
        if (!node || typeof node.getComponent !== "function") return;
        var view = null;
        try {
          view = node.getComponent("GarbageView");
        } catch (_) {}
        if (!view) return;
        if (!view.__discardOnlyPatched) {
          view.__discardOnlyPatched = true;
          var originalCleanInfo = typeof view.cleanInfo === "function" ? view.cleanInfo.bind(view) : null;
          var originalOnShow = typeof view.onShow === "function" ? view.onShow.bind(view) : null;
          if (originalCleanInfo) {
            view.cleanInfo = function patchedCleanInfo() {
              var result = originalCleanInfo.apply(view, arguments);
              setTimeout(function () { patchGarbageDialogButtons(view); }, 0);
              return result;
            };
          }
          if (originalOnShow) {
            view.onShow = function patchedOnShow() {
              var result = originalOnShow.apply(view, arguments);
              setTimeout(function () { patchGarbageDialogButtons(view); }, 0);
              setTimeout(function () { patchGarbageDialogButtons(view); }, 120);
              return result;
            };
          }
        }
        patchGarbageDialogButtons(view);
      });
    }

    function normalizeSceneTextAndAdButtons() {
      if (!window.cc || !cc.director || !cc.Label) return;
      var scene = cc.director.getScene && cc.director.getScene();
      if (!scene) return;
      walkNode(scene, function (node) {
        var name = String(node.name || "").toLowerCase();
        if (
          name.indexOf("gift_video") >= 0 ||
          name.indexOf("video") >= 0 ||
          name.indexOf("get_glod") >= 0 ||
          name.indexOf("get_gold") >= 0 ||
          name.indexOf("day_reward") >= 0 ||
          name.indexOf("daily") >= 0 ||
          name.indexOf("login_reward") >= 0
        ) {
          hideNode(node);
        }
        if (typeof node.getComponent !== "function") return;
        var label = node.getComponent(cc.Label);
        if (!label) return;
        var next = normalizeGameText(label.string);
        if (next !== label.string) label.string = next;
        if (/观看视频|看视频|视频广告|广告奖励|获取积分/.test(next)) {
          hideAdRewardNode(node);
        }
        if (/今日首次登陆获得积分|今日首次登录获得积分|首次登录|首次登陆|登录奖励|登陆奖励/.test(next)) {
          hideAdRewardNode(node);
          hideNode(node);
        }
      });
    }

    function installTextPatch() {
      if (textPatchInstalled || !window.cc || !cc.Label || !cc.Label.prototype) return;
      var proto = cc.Label.prototype;
      var owner = proto;
      var descriptor = null;
      while (owner && !descriptor) {
        descriptor = Object.getOwnPropertyDescriptor(owner, "string");
        owner = Object.getPrototypeOf(owner);
      }
      if (descriptor && descriptor.set && descriptor.get) {
        Object.defineProperty(proto, "string", {
          configurable: true,
          enumerable: descriptor.enumerable,
          get: function () {
            return descriptor.get.call(this);
          },
          set: function (value) {
            descriptor.set.call(this, normalizeGameText(value));
          },
        });
      }
      textPatchInstalled = true;
      normalizeSceneTextAndAdButtons();
    }

    function refreshFishingGold(balance) {
      var gold = Math.max(0, Math.floor(toNumber(balance)));
      pendingGold = gold;
      lastKnownGold = gold;
      updateLocalSaveGold(gold);

      if (!window.UserBaseInfo || typeof window.UserBaseInfo.setUserGold !== "function") {
        return;
      }

      suppressGoldSync = true;
      try {
        window.UserBaseInfo.setUserGold(gold);
        if (typeof window.UserBaseInfo.saveUserInfoData === "function") {
          window.UserBaseInfo.saveUserInfoData(true);
        }
        var canvas = window.cc && cc.director && cc.director.getScene()
          ? cc.director.getScene().getChildByName("Canvas")
          : null;
        if (canvas) {
          canvas.emit("updateGameView");
        }
      } finally {
        suppressGoldSync = false;
      }
    }

    function readCurrentGold() {
      if (!window.UserBaseInfo || typeof window.UserBaseInfo.getUserGold !== "function") {
        return null;
      }
      return Math.max(0, Math.floor(toNumber(window.UserBaseInfo.getUserGold())));
    }

    function syncCurrentGold(reason) {
      var current = readCurrentGold();
      if (current === null) return;
      if (lastKnownGold === null) {
        lastKnownGold = current;
        updateLocalSaveGold(current);
        return;
      }
      var delta = current - lastKnownGold;
      if (delta !== 0) {
        updateLocalSaveGold(current);
        if (!suppressGoldSync) {
          syncGoldDelta(delta, reason || nextGoldChangeReason || "");
        }
        lastKnownGold = current;
      }
    }

    function installAdPatch() {
      if (adPatchInstalled || !window.AdvertisementTools) return;
      adPatchInstalled = true;
      window.AdvertisementTools.getVideoErrCode = function () { return -1; };
      window.AdvertisementTools.createRewardedVideoAd = function () { return false; };
      window.AdvertisementTools.loadRewardedVideoAd = function () { return false; };
      window.AdvertisementTools.showRewardedVideoAd = function (callback) {
        if (callback) callback(false);
        return false;
      };
      window.AdvertisementTools.createFishGetBannerAd = function () { return false; };
      window.AdvertisementTools.createSkillUpdateBannerAd = function () { return false; };
      window.AdvertisementTools.closeSkillUpdateBannerAd = function () {};
      window.AdvertisementTools.closeFishGetBannerAd = function () {};
    }

    function scaleItemPrices(items) {
      if (!Array.isArray(items)) return;
      items.forEach(function (group) {
        if (!Array.isArray(group)) return;
        group.forEach(function (item) {
          if (item && typeof item.price !== "undefined" && !item.__jjyxEconomyScaled) {
            item.price = scaleEconomyValue(item.price);
            Object.defineProperty(item, "__jjyxEconomyScaled", { value: true });
          }
        });
      });
    }

    function scaleSkillCosts() {
      if (
        !window.SKILL_BASE_INFO ||
        !Array.isArray(window.SKILL_BASE_INFO.lvGold) ||
        window.SKILL_BASE_INFO.__jjyxEconomyScaled
      ) {
        return;
      }
      window.SKILL_BASE_INFO.lvGold = window.SKILL_BASE_INFO.lvGold.map(scaleEconomyValue);
      Object.defineProperty(window.SKILL_BASE_INFO, "__jjyxEconomyScaled", { value: true });
    }

    function scaleSceneCosts() {
      if (typeof window.getSceneCount !== "function" || typeof window.getSceneInfo !== "function") return;
      for (var i = 0; i < window.getSceneCount(); i += 1) {
        var scene = window.getSceneInfo(i);
        if (scene && typeof scene.consume !== "undefined" && !scene.__jjyxEconomyScaled) {
          scene.consume = scaleEconomyValue(scene.consume);
          Object.defineProperty(scene, "__jjyxEconomyScaled", { value: true });
        }
      }
    }

    function scaleTaskRewards() {
      if (typeof window.getTaskForID !== "function") return;
      for (var i = 0; i < 300; i += 1) {
        var task = window.getTaskForID(i);
        if (!task) continue;
        if (task.type === 1) continue;
        if (typeof task.gold !== "undefined" && !task.__jjyxEconomyScaled) {
          task.gold = scaleEconomyValue(task.gold);
          Object.defineProperty(task, "__jjyxEconomyScaled", { value: true });
        }
      }
    }

    function patchFishPriceFactory() {
      if (
        typeof window.CreateFishInfoForID !== "function" ||
        window.CreateFishInfoForID.__jjyxEconomyPatched
      ) {
        return;
      }
      var originalCreateFishInfoForID = window.CreateFishInfoForID;
      window.CreateFishInfoForID = function patchedCreateFishInfoForID() {
        var fish = originalCreateFishInfoForID.apply(this, arguments);
        if (fish && typeof fish.getFishPrice === "function" && !fish.__jjyxEconomyPatched) {
          var originalGetFishPrice = fish.getFishPrice.bind(fish);
          fish.getFishPrice = function patchedGetFishPrice() {
            return scaleFishRewardValue(originalGetFishPrice());
          };
          Object.defineProperty(fish, "__jjyxEconomyPatched", { value: true });
        }
        return fish;
      };
      Object.defineProperty(window.CreateFishInfoForID, "__jjyxEconomyPatched", { value: true });
    }

    function patchUserEconomyMethods() {
      if (!window.UserBaseInfo || window.UserBaseInfo.__jjyxEconomyPatched) return;

      if (typeof window.UserBaseInfo.getGiftGlod === "function") {
        var originalGetGiftGlod = window.UserBaseInfo.getGiftGlod.bind(window.UserBaseInfo);
        window.UserBaseInfo.getGiftGlod = function patchedGetGiftGlod() {
          return scaleEconomyValue(originalGetGiftGlod());
        };
      }

      if (typeof window.UserBaseInfo.sellGarbageItem === "function") {
        var originalSellGarbageItem = window.UserBaseInfo.sellGarbageItem.bind(window.UserBaseInfo);
        window.UserBaseInfo.sellGarbageItem = function patchedSellGarbageItem(gold) {
          nextGoldChangeReason = "fish_sell";
          try {
            return originalSellGarbageItem(scaleEconomyValue(gold));
          } finally {
            setTimeout(function () {
              if (nextGoldChangeReason === "fish_sell") nextGoldChangeReason = "";
            }, 0);
          }
        };
      }

      var shouldMigrateMemory = migrateActiveFishingSaveEconomy();
      if (shouldMigrateMemory && typeof window.UserBaseInfo.getFishItems === "function") {
        var fishItems = window.UserBaseInfo.getFishItems();
        if (Array.isArray(fishItems)) {
          fishItems.forEach(function (item) {
            if (item && typeof item.price !== "undefined") {
              item.price = scaleEconomyValue(item.price);
            }
          });
        }
      }

      for (var type = 0; type <= 5; type += 1) {
        if (typeof window.UserBaseInfo.getUserPackageItems === "function") {
          var packageItems = window.UserBaseInfo.getUserPackageItems(type);
          if (Array.isArray(packageItems)) {
            packageItems.forEach(scaleLoadedItemPrice);
          }
        }
      }
      [
        "getUseBaitItem",
        "getUseRodItem",
        "getUseHookItem",
        "getUseRopeItem",
        "getUseNetItem",
      ].forEach(function (method) {
        if (typeof window.UserBaseInfo[method] !== "function") return;
        var userItem = window.UserBaseInfo[method]();
        if (userItem && typeof userItem.getItemInfo === "function") {
          scaleLoadedItemPrice(userItem.getItemInfo());
        }
        if (userItem && typeof userItem.getItemAttribute === "function") {
          scaleAttributePrice(userItem.getItemAttribute());
        }
      });
      if (typeof window.UserBaseInfo.getUseBoxItem === "function") {
        scaleLoadedItemPrice(window.UserBaseInfo.getUseBoxItem());
      }

      Object.defineProperty(window.UserBaseInfo, "__jjyxEconomyPatched", { value: true });
    }

    function scaleAttributePrice(attribute) {
      if (!attribute || typeof attribute.price === "undefined" || attribute.__jjyxEconomyScaled) {
        return;
      }
      attribute.price = scaleEconomyValue(attribute.price);
      Object.defineProperty(attribute, "__jjyxEconomyScaled", { value: true });
    }

    function scaleLoadedItemPrice(item) {
      if (!item) return;
      scaleAttributePrice(item.itemAttribute);
      if (typeof item.price !== "undefined" && !item.__jjyxEconomyScaled) {
        item.price = scaleEconomyValue(item.price);
        Object.defineProperty(item, "__jjyxEconomyScaled", { value: true });
      }
    }

    function installEconomyPatch() {
      scaleItemPrices(window.ITEM_INFOS);
      scaleSkillCosts();
      scaleSceneCosts();
      scaleTaskRewards();
      patchFishPriceFactory();
      patchUserEconomyMethods();

      if (
        window.ITEM_INFOS &&
        window.SKILL_BASE_INFO &&
        window.UserBaseInfo &&
        typeof window.CreateFishInfoForID === "function" &&
        typeof window.getTaskForID === "function"
      ) {
        economyPatchInstalled = true;
      }
    }

    function installUserGoldBridge() {
      if (installed || !window.UserBaseInfo || typeof window.UserBaseInfo.setUserGold !== "function") {
        return;
      }
      installed = true;

      var originalSetUserGold = window.UserBaseInfo.setUserGold.bind(window.UserBaseInfo);
      var originalGetUserGold = typeof window.UserBaseInfo.getUserGold === "function"
        ? window.UserBaseInfo.getUserGold.bind(window.UserBaseInfo)
        : function () { return 0; };
      var originalSaveUserInfoData = typeof window.UserBaseInfo.saveUserInfoData === "function"
        ? window.UserBaseInfo.saveUserInfoData.bind(window.UserBaseInfo)
        : null;
      var originalOnNotifyEvent = typeof window.UserBaseInfo.onNotifyEvent === "function"
        ? window.UserBaseInfo.onNotifyEvent.bind(window.UserBaseInfo)
        : null;
      var originalGetDayReward = typeof window.UserBaseInfo.getDayReward === "function"
        ? window.UserBaseInfo.getDayReward.bind(window.UserBaseInfo)
        : null;

      window.UserBaseInfo.setUserGold = function patchedSetUserGold(value) {
        var before = toNumber(originalGetUserGold());
        var result = originalSetUserGold(value);
        var after = toNumber(originalGetUserGold());
        updateLocalSaveGold(after);
        if (!suppressGoldSync) {
          syncGoldDelta(after - before, nextGoldChangeReason || "");
        }
        lastKnownGold = Math.max(0, Math.floor(after));
        return result;
      };

      if (originalSaveUserInfoData) {
        window.UserBaseInfo.saveUserInfoData = function patchedSaveUserInfoData() {
          var result = originalSaveUserInfoData.apply(window.UserBaseInfo, arguments);
          migrateActiveFishingSaveEconomy();
          mirrorActiveSaveToAccount();
          syncCurrentGold();
          return result;
        };
      }

      if (originalOnNotifyEvent) {
        window.UserBaseInfo.onNotifyEvent = function patchedOnNotifyEvent(callback) {
          return originalOnNotifyEvent(function () {
            var result = callback && callback.apply(this, arguments);
            setTimeout(function () { syncCurrentGold(); }, 0);
            return result;
          });
        };
      }

      if (originalGetDayReward) {
        window.UserBaseInfo.getDayReward = function patchedGetDayReward() {
          if (typeof window.UserBaseInfo.setTadayGetGold === "function") {
            window.UserBaseInfo.setTadayGetGold(true);
          }
          markDailyRewardLocal(0, pendingGold || readCurrentGold() || 0, true);
          return 0;
        };
      }

      if (pendingGold !== null) {
        refreshFishingGold(pendingGold);
      }
    }

    window.onAppMessage = function onAppMessage(message) {
      if (!message) return;
      if (typeof message === "string") {
        try {
          message = JSON.parse(message);
        } catch (error) {
          return;
        }
      }

      var action = message.action;
      var data = message.data || {};
      if (action === "init") {
        appInitData = data;
        lastAccountIdentity = "";
        remoteSaveLoaded = false;
        remoteSaveData = null;
        activateAccountSave();
        var loadedSave = loadRemoteSaveSync(true);
        if (loadedSave) {
          applySaveToGame(loadedSave);
        }
        refreshFishingGold(pendingGold !== null ? pendingGold : balanceFromData(data, 0));
        setTimeout(maybeShowFishingEntryFee, 300);
      } else if (action === "balanceUpdate" || action === "pointsChangeResult") {
        if (action === "pointsChangeResult" && handleFishingEntryFeeResult(data)) {
          return;
        }
        if (data.success === false || typeof data.points !== "undefined" || typeof data.balance !== "undefined") {
          refreshFishingGold(balanceFromData(data, pendingGold || 0));
          setTimeout(maybeShowFishingEntryFee, 120);
        }
      }
    };

    installSaveStoragePatch();
    activateAccountSave();
    loadRemoteSaveSync(false);
    fitCocosCanvasToViewport();
    window.addEventListener("resize", fitCocosCanvasToViewport);
    window.addEventListener("orientationchange", function () {
      setTimeout(fitCocosCanvasToViewport, 120);
    });
    if (hasRealAccountData()) {
      refreshFishingGold(pendingGold !== null ? pendingGold : balanceFromData(appInitData, 0));
    }
    setInterval(function () {
      fitCocosCanvasToViewport();
      installTextPatch();
      installAdPatch();
      if (!economyPatchInstalled) installEconomyPatch();
      installUserGoldBridge();
      normalizeSceneTextAndAdButtons();
      patchFishingGarbageDialog();
      maybeShowFishingEntryFee();
      if (!suppressGoldSync) syncCurrentGold();
    }, 300);
  })();
</script>
