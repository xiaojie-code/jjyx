<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>Cocos Creator | spdz</title>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->

        content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

<body>
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes">
      <span style="width: 0%"></span>
    </div>
  </div>

<script>
  // 全局错误捕获 - 忽略 _assembler 相关的渲染错误（游戏节点生命周期问题）
  window.addEventListener('error', function(e) {
    if (e.message && e.message.includes('_assembler')) {
      e.preventDefault();
      return true;
    }
  });
  window.addEventListener('unhandledrejection', function(e) {
    if (e.reason && e.reason.message && e.reason.message.includes('_assembler')) {
      e.preventDefault();
    }
  });

  // Mock LieYingSDK + PolySDK for H5 standalone mode
  var _polyMock = {
    init: function() {},
    login: function(cb) { if (cb) cb({ code: 0 }); },
    showBanner: function() {},
    hideBanner: function() {},
    showInterstitial: function(cb) { if (cb) cb(); },
    showRewardedVideo: function(cb) { if (cb) cb({ code: 0, isEnded: true }); },
    reportScore: function() {},
    share: function() {},
    vibrate: function() {},
    getSystemInfo: function() { return { platform: 'h5' }; },
    platformEventCallback: function(a, b, c) { if (a) a(); },
    sdkConfig: { runSDK: '', sdk_key_tt: 'tt' },
    BannerAd: { createBannerAd: function(){}, showBannerAd: function(){}, hideBannerAd: function(){} },
    Recorder: { start: function(cb){if(cb)cb();}, stop: function(cb){if(cb)cb();}, shareVideo_tt: function(){}, videoPath: null, isStart: false },
  };
  window.PolySDK = _polyMock;
  // 拦截 boot，在引擎加载完成后注入 cc.LieYingSDK
  var _origBoot;
  Object.defineProperty(window, 'boot', {
    configurable: true,
    enumerable: true,
    set: function(fn) {
      _origBoot = function() {
        if (window.cc && !window.cc.LieYingSDK) {
          window.cc.LieYingSDK = { PolySDK: _polyMock };
        }
        // Polyfill: cc.p 在 2.4.x 中被移除，但游戏代码还在用
        if (window.cc && !window.cc.p) {
          window.cc.p = function(x, y) { return cc.v2(x, y); };
        }
        var bootReady = window.__SNAKE_BOOT_READY_PROMISE__;
        if (bootReady && typeof bootReady.then === "function") {
          bootReady.then(function () {
            fn();
          }).catch(function (error) {
            console.warn("[snake] boot preload failed:", error);
            fn();
          });
        } else {
          fn();
        }
      };
    },
    get: function() { return _origBoot; }
  });
</script>

<script>
  (function () {
    var REVIVE_COSTS = [100];
    var BEAN_POINTS = 0.5;
    var DEFAULT_SKIN_LIST = '{"skin_list":[1]}';
    var SKIN_PRICE_SCALE_THRESHOLD = 100;
    var appInitData = window.__GAME_APP_INIT__ || {};
    var suppressStorageHooks = false;
    var lastBalance = null;
    var saveTimer = null;
    var patchTimer = null;
    var toastTimer = null;
    var pointRequestSeq = 0;
    var pendingPointRequests = {};
    var roundState = {
      id: Date.now(),
      beans: 0,
      revives: 0,
      settled: false
    };

    function fitCocosCanvasToViewport() {
      var width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth || 0;
      var height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight || 0;
      if (!width || !height) return;
      var container = document.getElementById("Cocos2dGameContainer");
      var canvas = document.getElementById("GameCanvas");
      [document.documentElement, document.body, container, canvas].forEach(function (node) {
        if (!node || !node.style) return;
        node.style.width = width + "px";
        node.style.height = height + "px";
        node.style.margin = "0";
        node.style.padding = "0";
        if (node === container || node === canvas) {
          node.style.left = "0";
          node.style.top = "0";
        }
      });
      try {
        if (window.cc && cc.view) {
          cc.view.setFrameSize(width, height);
          cc.view.resizeWithBrowserSize(true);
        }
      } catch (_) {}
    }

    function toNumber(value) {
      var num = Number(value);
      return isFinite(num) ? num : 0;
    }

    function roundPoints(value) {
      return Math.round((toNumber(value) + Number.EPSILON) * 1000000) / 1000000;
    }

    function formatPoints(value) {
      var points = roundPoints(value);
      if (Math.abs(points - Math.round(points)) < 0.000001) {
        return String(Math.round(points));
      }
      return String(points).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
    }

    function scaleGamePointAmount(value) {
      var amount = toNumber(value);
      var sign = amount < 0 ? -1 : 1;
      var absolute = Math.abs(amount);
      if (absolute < 100) return roundPoints(amount);
      return sign * Math.max(10, Math.floor(absolute / 100) * 10);
    }

    function valueOr(value, fallback) {
      return value === null || typeof value === "undefined" ? fallback : value;
    }

    function getQueryParam(name) {
      try {
        return new URLSearchParams(window.location.search).get(name);
      } catch (_) {
        return null;
      }
    }

    function getGameId() {
      return toNumber(appInitData.gameId || getQueryParam("gameId") || 0);
    }

    function getToken() {
      var bootInit = window.__GAME_APP_INIT__ || {};
      return String(appInitData.token || bootInit.token || "");
    }

    function readLocalGold() {
      return toNumber(localStorage.getItem("tcs_gold") || 0);
    }

    function balanceFromData(data, fallback) {
      if (typeof data.points !== "undefined") return data.points;
      if (typeof data.balance !== "undefined") return data.balance;
      if (typeof data.coin !== "undefined") return data.coin;
      return typeof fallback !== "undefined" ? fallback : 0;
    }

    function apiFetch(path, options) {
      var token = getToken();
      if (!token) {
        return Promise.reject(new Error("missing token"));
      }
      var headers = {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      };
      return fetch(path, Object.assign({}, options || {}, { headers: headers }))
        .then(function (response) {
          return response.text().then(function (text) {
            var data = {};
            if (text) {
              try {
                data = JSON.parse(text);
              } catch (_) {
                data = { message: text };
              }
            }
            if (!response.ok) {
              throw new Error(data.message || data.error || "request failed");
            }
            return data;
          });
        });
    }

    function snakeApiPath(suffix) {
      return "/api/game/" + getGameId() + suffix;
    }

    function postGameMessage(action, data) {
      try {
        if (
          window.flutter_inappwebview &&
          typeof window.flutter_inappwebview.callHandler === "function"
        ) {
          window.flutter_inappwebview.callHandler(
            "gameMessage",
            JSON.stringify({ action: action, data: data || {} })
          );
        }
      } catch (error) {
        console.warn("[snake] app bridge failed:", error);
      }
    }

    function hasAppBridge() {
      return !!(
        window.flutter_inappwebview &&
        typeof window.flutter_inappwebview.callHandler === "function"
      );
    }

    function changePointsViaBridge(body) {
      return new Promise(function (resolve) {
        if (!hasAppBridge()) {
          resolve({ success: false, balance: valueOr(lastBalance, readLocalGold()), bridgeMissing: true });
          return;
        }
        var requestId = "snake_" + Date.now() + "_" + (++pointRequestSeq);
        var payload = Object.assign({}, body, { requestId: requestId });
        var timer = window.setTimeout(function () {
          if (pendingPointRequests[requestId]) {
            delete pendingPointRequests[requestId];
            resolve({ success: false, balance: valueOr(lastBalance, readLocalGold()), timeout: true });
          }
        }, 10000);
        pendingPointRequests[requestId] = {
          resolve: resolve,
          timer: timer
        };
        try {
          window.flutter_inappwebview.callHandler(
            "gameMessage",
            JSON.stringify({ action: "changePoints", data: payload })
          );
        } catch (error) {
          window.clearTimeout(timer);
          delete pendingPointRequests[requestId];
          console.warn("[snake] bridge points change failed:", error);
          resolve({ success: false, balance: valueOr(lastBalance, readLocalGold()), error: error });
        }
      });
    }

    function resolvePointRequest(data) {
      var requestId = data && data.requestId;
      if (!requestId || !pendingPointRequests[requestId]) return false;
      var pending = pendingPointRequests[requestId];
      window.clearTimeout(pending.timer);
      delete pendingPointRequests[requestId];
      pending.resolve({
        success: data.success !== false,
        balance: balanceFromData(data, valueOr(lastBalance, readLocalGold())),
        data: data
      });
      return true;
    }

    function normalizeMessage(message) {
      return String(message || "")
        .replace(/\u91d1\u5e01/g, "\u79ef\u5206")
        .replace(/\u94bb\u77f3/g, "\u79ef\u5206");
    }

    function ensureToastNode() {
      var node = document.getElementById("snake-points-toast");
      if (node) return node;
      node = document.createElement("div");
      node.id = "snake-points-toast";
      node.style.cssText = [
        "position:fixed",
        "left:50%",
        "top:16%",
        "transform:translateX(-50%)",
        "z-index:999999",
        "max-width:78vw",
        "box-sizing:border-box",
        "padding:12px 18px",
        "border-radius:8px",
        "background:rgba(14,24,42,.88)",
        "color:#fff",
        "font-size:18px",
        "font-weight:600",
        "line-height:1.35",
        "text-align:center",
        "box-shadow:0 8px 24px rgba(0,0,0,.32)",
        "opacity:0",
        "pointer-events:none",
        "transition:opacity .18s ease"
      ].join(";");
      document.body.appendChild(node);
      return node;
    }

    function ensureReviveOverlay() {
      var wrap = document.getElementById("snake-revive-overlay");
      if (wrap) return wrap;
      wrap = document.createElement("div");
      wrap.id = "snake-revive-overlay";
      wrap.style.cssText = [
        "position:fixed",
        "left:0",
        "right:0",
        "top:0",
        "bottom:0",
        "z-index:999998",
        "display:none",
        "pointer-events:none"
      ].join(";");
      var btn = document.createElement("button");
      btn.id = "snake-revive-button";
      btn.type = "button";
      btn.style.cssText = [
        "position:absolute",
        "left:50%",
        "top:62%",
        "transform:translate(-50%,-50%)",
        "min-width:170px",
        "height:48px",
        "padding:0 22px",
        "border:0",
        "border-radius:8px",
        "background:linear-gradient(#25b8ff,#0b83d8)",
        "color:#fff",
        "font-size:18px",
        "font-weight:700",
        "box-shadow:0 6px 16px rgba(0,0,0,.28)",
        "pointer-events:auto"
      ].join(";");
      wrap.appendChild(btn);
      document.body.appendChild(wrap);
      return wrap;
    }

    function hideReviveOverlay() {
      var wrap = document.getElementById("snake-revive-overlay");
      if (wrap) wrap.style.display = "none";
    }

    function updateReviveOverlay(gameOverUI, canRevive, cost) {
      var wrap = ensureReviveOverlay();
      var btn = document.getElementById("snake-revive-button");
      if (!gameOverUI || !gameOverUI.node || !gameOverUI.node.active || !canRevive) {
        wrap.style.display = "none";
        return;
      }
      btn.textContent = "\u79ef\u5206\u590d\u6d3b " + cost;
      btn.onclick = function () {
        gameOverUI.onRelive({ stopPropagation: function () {} });
      };
      wrap.style.display = "block";
    }

    function showMessage(message) {
      var text = normalizeMessage(message);
      var node = ensureToastNode();
      node.textContent = text;
      node.style.opacity = "1";
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(function () {
        node.style.opacity = "0";
      }, 1900);
      console.log("[snake]", text);
    }

    function refreshSnakeGold(balance) {
      var gold = Math.max(0, roundPoints(balance));
      suppressStorageHooks = true;
      try {
        localStorage.setItem("tcs_gold", formatPoints(gold));
        if (window.cc && cc.GameGlobal && cc.GameGlobal.DataManager) {
          cc.GameGlobal.DataManager.setCurGold(gold);
          if (cc.GameGlobal.UIManager && cc.GameGlobal.UIManager.RefreshCoin) {
            cc.GameGlobal.UIManager.RefreshCoin();
          }
        }
        lastBalance = gold;
      } finally {
        suppressStorageHooks = false;
      }
    }

    function scaleSkinPrice(price) {
      var value = Math.max(0, Math.floor(toNumber(price)));
      return value >= SKIN_PRICE_SCALE_THRESHOLD ? scaleGamePointAmount(value) : value;
    }

    function parseSkinIdList(raw) {
      var ids = [];
      try {
        var data = raw ? JSON.parse(raw) : null;
        var list = data && data.skin_list;
        if (list && list.length) {
          for (var i = 0; i < list.length; i += 1) {
            var id = Math.floor(toNumber(list[i]));
            if (id > 0 && ids.indexOf(id) < 0) ids.push(id);
          }
        }
      } catch (_) {}
      if (ids.indexOf(1) < 0) ids.unshift(1);
      return ids;
    }

    function mergeSkinIds() {
      var ids = [];
      for (var i = 0; i < arguments.length; i += 1) {
        var list = arguments[i] || [];
        for (var j = 0; j < list.length; j += 1) {
          var id = Math.floor(toNumber(list[j]));
          if (id > 0 && ids.indexOf(id) < 0) ids.push(id);
        }
      }
      if (ids.indexOf(1) < 0) ids.unshift(1);
      return ids;
    }

    function skinIdsFromSaveData(skinData) {
      var ids = [];
      if (!skinData || !skinData.length) return ids;
      for (var i = 0; i < skinData.length; i += 1) {
        var skin = skinData[i];
        if (!skin || !skin.isOwn) continue;
        var id = Math.floor(toNumber(skin.id || (i + 1)));
        if (id > 0 && ids.indexOf(id) < 0) ids.push(id);
      }
      return ids;
    }

    function saveSkinIdList(ids) {
      var nextValue = JSON.stringify({ skin_list: mergeSkinIds(ids) });
      if (localStorage.getItem("tcs_skinlist") !== nextValue) {
        localStorage.setItem("tcs_skinlist", nextValue);
      }
      return nextValue;
    }

    function normalizeSkinData() {
      try {
        var dataManager = cc.GameGlobal.DataManager;
        var skins = dataManager && dataManager._SKinDataArray;
        if (!skins || !skins.length) return;
        var ownedIds = parseSkinIdList(localStorage.getItem("tcs_skinlist") || DEFAULT_SKIN_LIST);
        var selectedIndex = Math.floor(toNumber(localStorage.getItem("tcs_skinIndex") || dataManager._CurMySKinIndex || 0));
        for (var i = 0; i < skins.length; i += 1) {
          if (skins[i]) {
            if (skins[i].IsOwn) ownedIds = mergeSkinIds(ownedIds, [i + 1]);
            skins[i].Type = cc.GameRewardType.RT_GOLD;
            if (typeof skins[i].__snakeBasePrice === "undefined") {
              skins[i].__snakeBasePrice = skins[i].Price;
            }
            skins[i].Price = scaleSkinPrice(skins[i].__snakeBasePrice);
          }
        }
        ownedIds = mergeSkinIds(ownedIds);
        for (var j = 0; j < skins.length; j += 1) {
          if (skins[j]) {
            skins[j].IsOwn = ownedIds.indexOf(j + 1) >= 0;
            skins[j].IsUse = j === selectedIndex;
          }
        }
        saveSkinIdList(ownedIds);
      } catch (_) {}
    }

    function collectStorageData() {
      var storage = {};
      for (var i = 0; i < localStorage.length; i += 1) {
        var key = localStorage.key(i);
        if (key && key.indexOf("tcs_") === 0) {
          storage[key] = String(localStorage.getItem(key));
        }
      }
      storage.tcs_gold = formatPoints(Math.max(0, valueOr(lastBalance, readLocalGold())));
      if (!storage.tcs_skinIndex) storage.tcs_skinIndex = "0";
      if (!storage.tcs_skinlist) storage.tcs_skinlist = DEFAULT_SKIN_LIST;
      if (typeof storage.tcs_diamond === "undefined") storage.tcs_diamond = "0";
      try {
        storage.tcs_skinlist = JSON.stringify({
          skin_list: mergeSkinIds(
            parseSkinIdList(storage.tcs_skinlist),
            getOwnedSkinIds(cc.GameGlobal.DataManager)
          )
        });
      } catch (_) {}
      return storage;
    }

    function collectSaveData() {
      var game = null;
      var skinData = [];
      try {
        game = cc.GameGlobal.UIManager.getUI(1);
      } catch (_) {}
      try {
        var skins = cc.GameGlobal.DataManager._SKinDataArray || [];
        for (var i = 0; i < skins.length; i += 1) {
          if (skins[i]) {
            skinData.push({
              id: skins[i].ID,
              price: skins[i].Price,
              type: cc.GameRewardType.RT_GOLD,
              isOwn: !!skins[i].IsOwn,
              isUse: !!skins[i].IsUse
            });
          }
        }
      } catch (_) {}
      return {
        storage: collectStorageData(),
        skinData: skinData,
        round: {
          beans: roundState.beans,
          revives: roundState.revives,
          lastLength: game && typeof game.getMySnakeLen === "function" ? game.getMySnakeLen() : 0,
          lastKill: game && typeof game.getMySnakeKill === "function" ? game.getMySnakeKill() : 0
        },
        updatedAt: new Date().toISOString()
      };
    }

    function applySaveData(saveData) {
      var storage = saveData && saveData.storage;
      if (!storage || typeof storage !== "object") storage = {};
      var ownedSkinIds = mergeSkinIds(
        parseSkinIdList(localStorage.getItem("tcs_skinlist") || DEFAULT_SKIN_LIST),
        parseSkinIdList(storage.tcs_skinlist || DEFAULT_SKIN_LIST),
        skinIdsFromSaveData(saveData && saveData.skinData)
      );
      storage.tcs_skinlist = JSON.stringify({ skin_list: ownedSkinIds });
      if (!storage.tcs_skinIndex) storage.tcs_skinIndex = localStorage.getItem("tcs_skinIndex") || "0";
      if (typeof storage.tcs_diamond === "undefined") storage.tcs_diamond = localStorage.getItem("tcs_diamond") || "0";
      suppressStorageHooks = true;
      try {
        Object.keys(storage).forEach(function (key) {
          if (key.indexOf("tcs_") === 0) {
            localStorage.setItem(key, String(storage[key]));
          }
        });
      } finally {
        suppressStorageHooks = false;
      }
      refreshSnakeGold(balanceFromData(saveData, appInitData.points || readLocalGold()));
      try {
        if (window.cc && cc.GameGlobal && cc.GameGlobal.Net && cc.GameGlobal.Net.requestUserInfo) {
          cc.GameGlobal.Net.requestUserInfo();
          normalizeSkinData();
          saveNow();
        }
      } catch (_) {}
    }

    function saveNow() {
      if (!getGameId() || !getToken()) return Promise.resolve(null);
      return apiFetch(snakeApiPath("/snake-save"), {
        method: "POST",
        body: JSON.stringify({ saveData: collectSaveData() })
      }).catch(function (error) {
        console.warn("[snake] save failed:", error);
      });
    }

    function scheduleSave(delay) {
      window.clearTimeout(saveTimer);
      saveTimer = window.setTimeout(saveNow, delay || 600);
    }

    function loadSnakeSave() {
      var initialPoints = balanceFromData(appInitData, readLocalGold());
      refreshSnakeGold(initialPoints);
      if (!getGameId() || !getToken()) return Promise.resolve(null);
      return apiFetch(snakeApiPath("/snake-save"), { method: "GET" })
        .then(function (data) {
          if (data && data.saveData) {
            applySaveData(data.saveData);
          }
          refreshSnakeGold(balanceFromData(data || {}, initialPoints));
          return data;
        })
        .catch(function (error) {
          console.warn("[snake] load save failed:", error);
          refreshSnakeGold(initialPoints);
          return null;
        });
    }

    function withTimeout(promise, timeoutMs) {
      return new Promise(function (resolve) {
        var done = false;
        var timer = window.setTimeout(function () {
          if (!done) {
            done = true;
            resolve(null);
          }
        }, timeoutMs);
        promise.then(function (value) {
          if (!done) {
            done = true;
            window.clearTimeout(timer);
            resolve(value);
          }
        }).catch(function () {
          if (!done) {
            done = true;
            window.clearTimeout(timer);
            resolve(null);
          }
        });
      });
    }

    function changePoints(amount, reason, extra) {
      var delta = roundPoints(amount);
      if (!delta) return Promise.resolve({ success: false, balance: valueOr(lastBalance, readLocalGold()) });
      var body = Object.assign({
        amount: delta,
        reason: reason || "snake_points_change"
      }, extra || {});
      if (hasAppBridge()) {
        return changePointsViaBridge(body).then(function (result) {
          if (result.success) {
            refreshSnakeGold(result.balance);
            scheduleSave();
          }
          return result;
        });
      }
      if (!getGameId() || !getToken()) {
        postGameMessage("changePoints", body);
        return Promise.resolve({ success: true, balance: valueOr(lastBalance, readLocalGold()), bridgeOnly: true });
      }
      return apiFetch(snakeApiPath("/points/change"), {
        method: "POST",
        body: JSON.stringify(body)
      }).then(function (data) {
        var balance = balanceFromData(data || {}, valueOr(lastBalance, readLocalGold()));
        refreshSnakeGold(balance);
        scheduleSave();
        return { success: true, balance: balance, data: data };
      }).catch(function (error) {
        console.warn("[snake] points change failed:", error);
        refreshSnakeGold(valueOr(lastBalance, readLocalGold()));
        return { success: false, balance: valueOr(lastBalance, readLocalGold()), error: error };
      });
    }

    function installStorageBridge() {
      if (window.__SNAKE_POINTS_STORAGE_BRIDGE__) return;
      window.__SNAKE_POINTS_STORAGE_BRIDGE__ = true;

      var nativeSetItem = Storage.prototype.setItem;
      Storage.prototype.setItem = function patchedSetItem(key, value) {
        var name = String(key);
        var oldGold = name === "tcs_gold" ? readLocalGold() : 0;
        var result = nativeSetItem.apply(this, arguments);
        if (name.indexOf("tcs_") === 0 && !suppressStorageHooks) {
          scheduleSave();
        }
        if (name === "tcs_gold" && !suppressStorageHooks) {
          var nextGold = toNumber(value);
          var delta = nextGold - oldGold;
          if (delta !== 0) {
            var scaledDelta = scaleGamePointAmount(delta);
            var scaledGold = Math.max(0, roundPoints(oldGold + scaledDelta));
            refreshSnakeGold(scaledGold);
            changePoints(scaledDelta, scaledDelta > 0 ? "snake_local_earn" : "snake_local_spend");
          }
        }
        return result;
      };
    }

    function stopButtonEvents(button, target) {
      if (!button || !button.node) return;
      try {
        if (button.node.targetOff) button.node.targetOff(target);
      } catch (_) {}
    }

    function setNodeLabel(node, text) {
      if (!node || !window.cc) return;
      try {
        var labels = node.getComponentsInChildren(cc.Label) || [];
        for (var i = 0; i < labels.length; i += 1) {
          labels[i].string = text;
        }
      } catch (_) {}
    }

    function walkCocosNode(node, visitor) {
      if (!node) return;
      visitor(node);
      var children = node.children || [];
      for (var i = 0; i < children.length; i += 1) {
        walkCocosNode(children[i], visitor);
      }
    }

    function getNodeText(node) {
      var parts = [];
      function collect(child, depth) {
        try {
          if (!child.getComponent || !window.cc || !cc.Label) return;
          var label = child.getComponent(cc.Label);
          if (label && typeof label.string !== "undefined") {
            parts.push(String(label.string || ""));
          }
        } catch (_) {}
        if (depth >= 2) return;
        var children = child.children || [];
        for (var i = 0; i < children.length; i += 1) {
          collect(children[i], depth + 1);
        }
      }
      collect(node, 0);
      return parts.join(" ");
    }

    function hasOwnLabel(node) {
      try {
        return !!(node && node.getComponent && window.cc && cc.Label && node.getComponent(cc.Label));
      } catch (_) {
        return false;
      }
    }

    function findMenuButtonTarget(node) {
      var current = node;
      for (var i = 0; i < 5 && current; i += 1) {
        try {
          var name = String(current.name || "").toLowerCase();
          if (
            (current.getComponent && window.cc && cc.Button && current.getComponent(cc.Button)) ||
            name.indexOf("btn") >= 0 ||
            name.indexOf("button") >= 0
          ) {
            return current;
          }
        } catch (_) {}
        current = current.parent;
      }
      return null;
    }

    function hideMenuNode(node) {
      var target = findMenuButtonTarget(node);
      if (target && target.parent) {
        target.active = false;
        return;
      }
      if (hasOwnLabel(node)) {
        node.active = false;
      }
    }

    function hideMainMenuControls() {
      if (!window.cc || !cc.director || !cc.Label) return;
      var scene = cc.director.getScene && cc.director.getScene();
      if (!scene) return;
      walkCocosNode(scene, function (node) {
        var name = String(node.name || "").toLowerCase();
        var text = getNodeText(node);
        if (
          text.indexOf("无尽模式") >= 0 ||
          text.indexOf("签到") >= 0 ||
          name.indexOf("endless") >= 0 ||
          name.indexOf("signin") >= 0 ||
          name.indexOf("sign_in") >= 0 ||
          name.indexOf("checkin") >= 0 ||
          name.indexOf("qiandao") >= 0
        ) {
          hideMenuNode(node);
        }
      });
    }

    function getUI(type) {
      try {
        return cc.GameGlobal.UIManager.getUI(type);
      } catch (_) {
        return null;
      }
    }

    function patchUIMessage() {
      var manager = cc.GameGlobal && cc.GameGlobal.UIManager;
      if (!manager || manager.__snakeMessagePatched) return;
      manager.__snakeMessagePatched = true;
      manager.showMessage = function patchedShowMessage(message) {
        showMessage(message);
      };
    }

    function patchNet() {
      var net = cc.GameGlobal && cc.GameGlobal.Net;
      if (!net) return;
      if (!net.__snakeUserInfoPatched && typeof net.requestUserInfo === "function") {
        net.__snakeUserInfoPatched = true;
        var originalRequestUserInfo = net.requestUserInfo;
        net.requestUserInfo = function patchedRequestUserInfo() {
          var result = originalRequestUserInfo.apply(this, arguments);
          normalizeSkinData();
          try {
            var skinUI = getUI(10);
            if (skinUI && skinUI.updateSkin) skinUI.updateSkin();
          } catch (_) {}
          return result;
        };
      }
      if (!net.__snakeScoreGoldPatched) {
        net.__snakeScoreGoldPatched = true;
        net.requestScoreGold = function patchedRequestScoreGold(score) {
          settleRound(score);
        };
      }
    }

    function resetRound() {
      roundState = {
        id: Date.now(),
        beans: 0,
        revives: 0,
        settled: false
      };
      scheduleSave();
    }

    function settleRound(score) {
      if (roundState.settled) return;
      roundState.settled = true;
      var earned = Math.max(0, roundPoints(roundState.beans * BEAN_POINTS));
      var gameEndUI = getUI(4);
      if (gameEndUI && gameEndUI.refreshRewardGold) {
        gameEndUI.refreshRewardGold("+" + formatPoints(earned) + " \u79ef\u5206");
      }
      var saveAfterSettle = function () {
        scheduleSave(100);
      };
      if (earned <= 0) {
        saveAfterSettle();
        return;
      }
      changePoints(earned, "snake_round_settle", {
        beans: roundState.beans,
        score: score || 0,
        revives: roundState.revives
      }).then(function (result) {
        if (result.success) {
          showMessage("\u672c\u5c40\u83b7\u5f97 " + formatPoints(earned) + " \u79ef\u5206");
        }
        saveAfterSettle();
      });
    }

    function patchGameUI() {
      var gameUI = getUI(1);
      if (!gameUI || gameUI.__snakeGamePatched) return;
      gameUI.__snakeGamePatched = true;

      var originalOnEnable = gameUI.onEnable;
      gameUI.onEnable = function patchedGameOnEnable() {
        resetRound();
        return originalOnEnable.apply(this, arguments);
      };

      var originalResetGameEnd = gameUI.resetGameEnd;
      gameUI.resetGameEnd = function patchedResetGameEnd() {
        resetRound();
        return originalResetGameEnd.apply(this, arguments);
      };

      var originalOnSnakeHitFood = gameUI.onSnakeHitFood;
      gameUI.onSnakeHitFood = function patchedOnSnakeHitFood(snake) {
        if (snake === this._SnakeList[0] && this._GameState === 2) {
          roundState.beans += 1;
          scheduleSave(1000);
        }
        return originalOnSnakeHitFood.apply(this, arguments);
      };

      var originalSetGameState = gameUI.setGameState;
      gameUI.setGameState = function patchedSetGameState(state) {
        var result = originalSetGameState.apply(this, arguments);
        if (state === 4) {
          settleRound(this.getMySnakeLen ? this.getMySnakeLen() : 0);
        }
        return result;
      };
    }

    function doGameOverSettle(ui) {
      try {
        hideReviveOverlay();
        if (ui && ui.unscheduleAllCallbacks) ui.unscheduleAllCallbacks();
        var manager = cc.GameGlobal.UIManager;
        manager.closeUI(2);
        manager.getUI(1).setGameState(4);
      } catch (error) {
        console.warn("[snake] settle from game over failed:", error);
      }
    }

    function rebindGameOverButtons(gameOverUI) {
      if (!gameOverUI || !window.cc) return;
      stopButtonEvents(gameOverUI.ReliveBtn, gameOverUI);
      stopButtonEvents(gameOverUI.VideoReliveBtn, gameOverUI);
      stopButtonEvents(gameOverUI.BackBtn, gameOverUI);
      stopButtonEvents(gameOverUI.CloseBtn, gameOverUI);
      if (gameOverUI.ReliveBtn) gameOverUI.ReliveBtn.node.on(cc.Node.EventType.TOUCH_END, gameOverUI.onRelive, gameOverUI);
      if (gameOverUI.VideoReliveBtn) gameOverUI.VideoReliveBtn.node.on(cc.Node.EventType.TOUCH_END, gameOverUI.onRelive, gameOverUI);
      if (gameOverUI.BackBtn) gameOverUI.BackBtn.node.on(cc.Node.EventType.TOUCH_END, gameOverUI.onBack, gameOverUI);
      if (gameOverUI.CloseBtn) gameOverUI.CloseBtn.node.on(cc.Node.EventType.TOUCH_END, gameOverUI.onBack, gameOverUI);
    }

    function patchGameOverUI() {
      var gameOverUI = getUI(2);
      if (!gameOverUI) return;
      if (gameOverUI.__snakeGameOverPatched) {
        enforceGameOverUI(gameOverUI);
        return;
      }
      gameOverUI.__snakeGameOverPatched = true;

      var originalOnEnable = gameOverUI.onEnable;
      gameOverUI.onEnable = function patchedGameOverOnEnable() {
        originalOnEnable.apply(this, arguments);
        rebindGameOverButtons(this);
        var cost = REVIVE_COSTS[roundState.revives];
        var canRevive = typeof cost !== "undefined";
        enforceGameOverUI(this);
        if (!canRevive) {
          showMessage("\u672c\u5c40\u590d\u6d3b\u6b21\u6570\u5df2\u7528\u5b8c\uff0c\u6b63\u5728\u7ed3\u7b97");
          var self = this;
          this.scheduleOnce(function () {
            doGameOverSettle(self);
          }, 0.8);
        }
      };

      gameOverUI.onRelive = function patchedPointRelive(event) {
        if (event && event.stopPropagation) event.stopPropagation();
        var cost = REVIVE_COSTS[roundState.revives];
        if (typeof cost === "undefined") {
          doGameOverSettle(this);
          return;
        }
        if (cost > toNumber(valueOr(lastBalance, readLocalGold()))) {
          showMessage("\u79ef\u5206\u4e0d\u8db3\uff0c\u65e0\u6cd5\u590d\u6d3b");
          return;
        }
        var self = this;
        this._IsPause = true;
        changePoints(-cost, "snake_revive_" + (roundState.revives + 1), {
          reviveNo: roundState.revives + 1
        }).then(function (result) {
          self._IsPause = false;
          if (!result.success) {
            showMessage("\u79ef\u5206\u4e0d\u8db3\uff0c\u65e0\u6cd5\u590d\u6d3b");
            return;
          }
          roundState.revives += 1;
          hideReviveOverlay();
          if (self.unscheduleAllCallbacks) self.unscheduleAllCallbacks();
          var manager = cc.GameGlobal.UIManager;
          manager.closeUI(2);
          manager.getUI(1).reliveResetGame();
          showMessage("\u590d\u6d3b\u6210\u529f\uff0c\u6263\u9664 " + cost + " \u79ef\u5206");
          scheduleSave(100);
        });
      };
      gameOverUI.onShareRelieve = gameOverUI.onRelive;
      gameOverUI.onVideoRelive = gameOverUI.onRelive;
      gameOverUI.onBack = function patchedGameOverBack(event) {
        if (event && event.stopPropagation) event.stopPropagation();
        doGameOverSettle(this);
      };
      gameOverUI.onTimer = function patchedGameOverTimer() {
        if (this._IsPause === true) return;
        this._CurTimeCount -= 1;
        if (this.TimerLabel) this.TimerLabel.string = String(this._CurTimeCount);
        if (this._CurTimeCount <= 0) {
          doGameOverSettle(this);
        }
      };

      var originalStart = gameOverUI.start;
      gameOverUI.start = function patchedGameOverStart() {
        var result = originalStart ? originalStart.apply(this, arguments) : undefined;
        rebindGameOverButtons(this);
        enforceGameOverUI(this);
        return result;
      };

      rebindGameOverButtons(gameOverUI);
      enforceGameOverUI(gameOverUI);
    }

    function enforceGameOverUI(gameOverUI) {
      if (!gameOverUI) return;
      var cost = REVIVE_COSTS[roundState.revives];
      var canRevive = typeof cost !== "undefined";
      if (gameOverUI.VideoReliveBtn) gameOverUI.VideoReliveBtn.node.active = false;
      if (gameOverUI.BackBtn) gameOverUI.BackBtn.node.active = false;
      if (gameOverUI.AgainBtn) gameOverUI.AgainBtn.node.active = false;
      if (gameOverUI.ReliveBtn) {
        gameOverUI.ReliveBtn.node.active = false;
        setNodeLabel(gameOverUI.ReliveBtn.node, "\u79ef\u5206\u590d\u6d3b " + (cost || ""));
      }
      updateReviveOverlay(gameOverUI, canRevive, cost);
      if (gameOverUI.node && gameOverUI.node.active && !canRevive) {
        window.setTimeout(function () {
          if (gameOverUI.node && gameOverUI.node.active) doGameOverSettle(gameOverUI);
        }, 800);
      }
    }

    function getOwnedSkinIds(dataManager) {
      var ids = [];
      var skins = dataManager._SKinDataArray || [];
      for (var i = 0; i < skins.length; i += 1) {
        if (skins[i] && skins[i].IsOwn) ids.push(i + 1);
      }
      return ids;
    }

    function rebindSkinButtons(skinUI) {
      if (!skinUI || !window.cc) return;
      stopButtonEvents(skinUI.BuyBtn, skinUI);
      if (skinUI.BuyBtn) skinUI.BuyBtn.node.on(cc.Node.EventType.TOUCH_END, skinUI.onBuyBtn, skinUI);
    }

    function patchSkinUI() {
      var skinUI = getUI(10);
      if (!skinUI) return;
      if (skinUI.__snakeSkinPatched) {
        enforceSkinUI(skinUI);
        return;
      }
      skinUI.__snakeSkinPatched = true;
      var originalUpdateSkin = skinUI.updateSkin;
      skinUI.updateSkin = function patchedUpdateSkin() {
        normalizeSkinData();
        return originalUpdateSkin.apply(this, arguments);
      };

      skinUI.onBuyBtn = function patchedBuySkin(event) {
        if (event && event.stopPropagation) event.stopPropagation();
        if (this.__snakeBuying) return;
        var dataManager = cc.GameGlobal.DataManager;
        normalizeSkinData();
        if (this._CurSlectSkinIndex >= dataManager._SKinDataArray.length) return;
        var skin = dataManager._SKinDataArray[this._CurSlectSkinIndex];
        if (!skin) return;
        if (skin.IsOwn) {
          showMessage("\u5df2\u62e5\u6709\u8be5\u5f62\u8c61");
          return;
        }
        var price = Math.max(0, Math.floor(toNumber(skin.Price)));
        if (price > toNumber(valueOr(lastBalance, dataManager.CurGold))) {
          showMessage("\u79ef\u5206\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8d2d\u4e70");
          return;
        }
        var self = this;
        this.__snakeBuying = true;
        if (this.BuyBtn) this.BuyBtn.interactable = false;
        changePoints(-price, "snake_skin_buy", {
          skinId: String(skin.ID || this._CurSlectSkinIndex + 1)
        }).then(function (result) {
          self.__snakeBuying = false;
          if (self.BuyBtn) self.BuyBtn.interactable = true;
          if (!result.success) {
            showMessage("\u79ef\u5206\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8d2d\u4e70");
            return;
          }
          skin.IsOwn = true;
          skin.Type = cc.GameRewardType.RT_GOLD;
          var ids = getOwnedSkinIds(dataManager);
          if (ids.indexOf(self._CurSlectSkinIndex + 1) < 0) {
            ids.push(self._CurSlectSkinIndex + 1);
          }
          localStorage.setItem("tcs_skinlist", JSON.stringify({ skin_list: ids }));
          cc.GameGlobal.Net.requestUserInfo();
          self.updateSkin();
          showMessage("\u8d2d\u4e70\u6210\u529f\uff0c\u82b1\u8d39 " + price + " \u79ef\u5206");
          saveNow();
        });
      };

      var originalStart = skinUI.start;
      skinUI.start = function patchedSkinStart() {
        var result = originalStart ? originalStart.apply(this, arguments) : undefined;
        rebindSkinButtons(this);
        enforceSkinUI(this);
        return result;
      };

      rebindSkinButtons(skinUI);
      enforceSkinUI(skinUI);
    }

    function enforceSkinUI(skinUI) {
      if (!skinUI) return;
      normalizeSkinData();
      try {
        if (skinUI.updateSkin) skinUI.updateSkin();
      } catch (_) {}
      try {
        var dataManager = cc.GameGlobal.DataManager;
        var skins = dataManager && dataManager._SKinDataArray;
        if (!skins || skinUI._CurSlectSkinIndex >= skins.length) return;
        var skin = skins[skinUI._CurSlectSkinIndex];
        if (!skin) return;
        if (skinUI.BuyBtn) {
          skinUI.BuyBtn.node.active = !skin.IsOwn;
          setNodeLabel(skinUI.BuyBtn.node, "\u79ef\u5206\u8d2d\u4e70");
        }
      } catch (_) {}
    }

    function patchGame() {
      if (!window.cc || !cc.GameGlobal || !cc.GameGlobal.UIManager) return;
      fitCocosCanvasToViewport();
      patchUIMessage();
      patchNet();
      patchGameUI();
      patchGameOverUI();
      patchSkinUI();
      hideMainMenuControls();
      if (lastBalance !== null) refreshSnakeGold(lastBalance);
    }

    function startPatchLoop() {
      if (patchTimer) return;
      patchTimer = window.setInterval(patchGame, 300);
    }

    window.onAppMessage = function onAppMessage(message) {
      if (!message) return;
      if (typeof message === "string") {
        try {
          message = JSON.parse(message);
        } catch (error) {
          return;
        }
      }

      var action = message.action;
      var data = message.data || {};
      if (action === "init") {
        appInitData = data;
        refreshSnakeGold(balanceFromData(data, 0));
        loadSnakeSave().then(function () {
          startPatchLoop();
          patchGame();
        });
      } else if (action === "balanceUpdate" || action === "pointsChangeResult") {
        resolvePointRequest(data);
        if (data.success === false || typeof data.points !== "undefined" || typeof data.balance !== "undefined") {
          refreshSnakeGold(balanceFromData(data, lastBalance || 0));
          scheduleSave();
        }
      }
    };

    installStorageBridge();
    window.__SNAKE_BOOT_READY_PROMISE__ = withTimeout(loadSnakeSave(), 2500);
    window.__SNAKE_POINTS_BRIDGE__ = {
      changePoints: changePoints,
      saveNow: saveNow,
      loadSave: loadSnakeSave,
      getRoundState: function () { return Object.assign({}, roundState); }
    };
    startPatchLoop();
    fitCocosCanvasToViewport();
    window.addEventListener("resize", fitCocosCanvasToViewport);
    window.addEventListener("orientationchange", function () {
      setTimeout(fitCocosCanvasToViewport, 120);
    });
  })();
</script>
