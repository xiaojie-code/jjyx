<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>Cocos Creator | spdz</title>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->
  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- force webkit on 360 -->
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <!-- force edge on IE -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">

  <!-- force full screen on some browser -->
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  
  <!-- force screen orientation on some browser -->
  <meta name="screen-orientation" content="landscape"/>
  <meta name="x5-orientation" content="landscape">

  <!--fix fireball/issues/3568 -->
  <!--<meta name="browsermode" content="application">-->
  <meta name="x5-page-mode" content="app">

  <!--<link rel="apple-touch-icon" href=".png" />-->
  <!--<link rel="apple-touch-icon-precomposed" href=".png" />-->

  <link rel="stylesheet" type="text/css" href="style-mobile.25fc5.css"/>
  <link rel="icon" href="favicon.8de18.ico"/>
</head>
<body>
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes">
      <span style="width: 0%"></span>
    </div>
  </div>

<script>
  // 全局错误捕获 - 忽略 _assembler 相关的渲染错误（游戏节点生命周期问题）
  window.addEventListener('error', function(e) {
    if (e.message && e.message.includes('_assembler')) {
      e.preventDefault();
      return true;
    }
  });
  window.addEventListener('unhandledrejection', function(e) {
    if (e.reason && e.reason.message && e.reason.message.includes('_assembler')) {
      e.preventDefault();
    }
  });

  // Mock LieYingSDK + PolySDK for H5 standalone mode
  var _polyMock = {
    init: function() {},
    login: function(cb) { if (cb) cb({ code: 0 }); },
    showBanner: function() {},
    hideBanner: function() {},
    showInterstitial: function(cb) { if (cb) cb(); },
    showRewardedVideo: function(cb) { if (cb) cb({ code: 0, isEnded: true }); },
    reportScore: function() {},
    share: function() {},
    vibrate: function() {},
    getSystemInfo: function() { return { platform: 'h5' }; },
    platformEventCallback: function(a, b, c) { if (a) a(); },
    sdkConfig: { runSDK: '', sdk_key_tt: 'tt' },
    BannerAd: { createBannerAd: function(){}, showBannerAd: function(){}, hideBannerAd: function(){} },
    Recorder: { start: function(cb){if(cb)cb();}, stop: function(cb){if(cb)cb();}, shareVideo_tt: function(){}, videoPath: null, isStart: false },
  };
  window.PolySDK = _polyMock;
  // 拦截 boot，在引擎加载完成后注入 cc.LieYingSDK
  var _origBoot;
  Object.defineProperty(window, 'boot', {
    configurable: true,
    enumerable: true,
    set: function(fn) {
      _origBoot = function() {
        if (window.cc && !window.cc.LieYingSDK) {
          window.cc.LieYingSDK = { PolySDK: _polyMock };
        }
        // Polyfill: cc.p 在 2.4.x 中被移除，但游戏代码还在用
        if (window.cc && !window.cc.p) {
          window.cc.p = function(x, y) { return cc.v2(x, y); };
        }
        fn();
      };
    },
    get: function() { return _origBoot; }
  });
</script>

<script src="src/settings.c489d.js" charset="utf-8"></script>

<script src="main.1f853.js" charset="utf-8"></script>

<script type="text/javascript">
(function () {
    // open web debugger console
    if (typeof VConsole !== 'undefined') {
        window.vConsole = new VConsole();
    }

    var debug = window._CCSettings.debug;
    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    function loadScript (moduleName, cb) {
      function scriptLoaded () {
          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
      };
      var domScript = document.createElement('script');
      domScript.async = true;
      domScript.src = moduleName;
      domScript.addEventListener('load', scriptLoaded, false);
      document.body.appendChild(domScript);
    }

    loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.0b52a.js', function () {
      if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
        loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
      }
      else {
        window.boot();
      }
    });
})();
</script>
</body>
</html>
