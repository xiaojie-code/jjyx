name: competitive_game_platform
description: 竞技游戏平台 - 社交+游戏+虚拟经济一体化移动应用
publish_to: 'none'
version: 1.0.8+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Routing
  go_router: ^13.2.0

  # Network
  dio: ^5.4.0

  # WebView (H5 games)
  flutter_inappwebview: ^6.0.0

  # Image handling
  image_picker: ^1.0.7

  # Local storage
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.2

  # WebSocket (IM)
  socket_io_client: ^2.0.3+1

  # JSON serialization
  json_annotation: ^4.8.1
  flutter_webrtc:
    path: third_party/flutter_webrtc
  record: ^6.2.1
  path_provider: ^2.1.5
  audioplayers: ^6.4.0
  permission_handler: ^12.0.1
  video_player: ^2.8.2
  crypto: ^3.0.3
  tencent_trtc_cloud: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

dependency_overrides:
  record_android:
    path: third_party/record_android

flutter:
  uses-material-design: true
  assets:
    - video/
    - assets/notification.mp3
    - assets/app-icon/
    - assets/game-icons/
    - assets/shangcheng/
