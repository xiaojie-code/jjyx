<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="competitive_game_platform">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>competitive_game_platform</title>
  <link rel="manifest" href="manifest.json">
  <script src="js/TrtcWrapper.2.0.0-dev.0.0.2.bundle.js" type="application/javascript"></script>
  <script>
    (() => {
      const sizeTrtcViews = (root) => {
        if (!root || !root.querySelectorAll) return;
        root.querySelectorAll('[id^="HTMLID_trtcCloudChannelView"]').forEach((view) => {
          view.style.width = '100%';
          view.style.height = '100%';
          view.style.overflow = 'hidden';
          view.querySelectorAll('video').forEach((video) => {
            video.style.width = '100%';
            video.style.height = '100%';
            video.style.objectFit = 'cover';
          });
        });
      };
      window.addEventListener('DOMContentLoaded', () => {
        sizeTrtcViews(document);
        new MutationObserver(() => sizeTrtcViews(document)).observe(
          document.documentElement,
          { childList: true, subtree: true },
        );
      });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
