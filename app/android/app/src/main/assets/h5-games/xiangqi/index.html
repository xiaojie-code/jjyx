<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>象棋游戏</title>
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="renderer" content="webkit">
  <meta name="force-rendering" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="full-screen" content="yes">
  <meta name="x5-fullscreen" content="true">
  <meta name="360-fullscreen" content="true">
  <meta name="screen-orientation" content="portrait">
  <meta name="x5-orientation" content="portrait">
  <meta name="x5-page-mode" content="app">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #101828;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #GameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      background: #101828;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101828;
      color: #fff;
      font: 600 16px/1.4 Arial, "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    #xiangqiTitle {
      position: fixed;
      top: 84px;
      left: 0;
      right: 0;
      z-index: 6;
      display: none;
      justify-content: center;
      pointer-events: none;
      font: 700 54px/1.1 "STXingkai", "KaiTi", "Microsoft YaHei", serif;
      color: #8b3a12;
      letter-spacing: 0;
      text-shadow:
        0 2px 0 #f8e3a4,
        0 4px 8px rgba(72, 38, 8, 0.28);
    }

    #xiangqiTitle::before {
      content: "";
      position: absolute;
      top: 15px;
      width: 300px;
      height: 44px;
      z-index: -1;
      background: linear-gradient(90deg, rgba(224, 166, 58, 0), rgba(224, 166, 58, 0.58), rgba(224, 166, 58, 0));
      transform: skewX(-10deg);
    }

    #xiangqiHomeOverlay {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: none;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 242, 207, 0.08), rgba(88, 47, 16, 0.24)),
        url("assets/main/native/1b/1bd37f71-2a17-4d2c-b956-56c23f0e6a83.9346f.png") center / cover no-repeat;
      pointer-events: auto;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    #xiangqiHomeOverlay.show {
      display: block;
    }

    #xiangqiHomeOverlay::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42%;
      background: linear-gradient(180deg, rgba(255, 246, 225, 0), rgba(76, 39, 11, 0.36));
      pointer-events: none;
    }

    .xiangqi-home-menu {
      position: absolute;
      left: 50%;
      top: 42%;
      z-index: 1;
      width: min(320px, calc(100vw - 54px));
      transform: translateX(-50%);
      display: grid;
      gap: 24px;
    }

    .xiangqi-home-button {
      position: relative;
      min-height: 72px;
      border: 1px solid rgba(133, 82, 24, 0.58);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 246, 213, 0.96), rgba(235, 178, 86, 0.9)),
        linear-gradient(90deg, rgba(99, 58, 17, 0), rgba(99, 58, 17, 0.18), rgba(99, 58, 17, 0));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.78),
        inset 0 -5px 10px rgba(145, 83, 22, 0.18),
        0 10px 20px rgba(65, 34, 8, 0.22);
      color: #5b3411;
      font: 800 27px/1.05 "KaiTi", "STKaiti", "Microsoft YaHei", serif;
      letter-spacing: 0;
    }

    .xiangqi-home-button::before,
    .xiangqi-home-button::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 34px;
      height: 10px;
      border-top: 2px solid rgba(149, 88, 20, 0.62);
      border-bottom: 2px solid rgba(255, 248, 213, 0.66);
      transform: translateY(-50%);
    }

    .xiangqi-home-button::before {
      left: 18px;
    }

    .xiangqi-home-button::after {
      right: 18px;
    }

    .xiangqi-home-button span {
      display: block;
      padding-top: 2px;
      text-shadow: 0 1px 0 rgba(255, 247, 214, 0.9);
    }

    #xiangqiPointsBadge {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      right: 10px;
      z-index: 12;
      min-width: 112px;
      height: 34px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 17px;
      border: 1px solid rgba(255, 235, 183, 0.9);
      background: rgba(85, 44, 15, 0.86);
      box-shadow: 0 4px 12px rgba(38, 18, 5, 0.22);
      color: #ffe7a3;
      font: 700 13px/1 Arial, "Microsoft YaHei", sans-serif;
      pointer-events: none;
      transform: none;
      visibility: hidden;
      opacity: 0;
      transition: top 0.18s ease, left 0.18s ease, right 0.18s ease, transform 0.18s ease, opacity 0.18s ease;
    }

    #xiangqiPointsBadge b {
      color: #fff7d6;
      font-size: 15px;
      font-weight: 800;
    }

    body[data-xq-screen="home"] #xiangqiPointsBadge {
      top: 28%;
      left: 50%;
      right: auto;
      transform: translateX(-50%);
      visibility: visible;
      opacity: 1;
    }

    body[data-xq-screen="room"] #xiangqiPointsBadge,
    body[data-xq-screen="study"] #xiangqiPointsBadge {
      top: calc(env(safe-area-inset-top, 0px) + 92px);
      left: 50%;
      right: auto;
      transform: translateX(-50%);
      visibility: visible;
      opacity: 1;
    }

    body[data-xq-screen="game"] #xiangqiPointsBadge {
      display: none;
    }

    #xiangqiRoomEntryOverlay {
      position: fixed;
      inset: 0;
      z-index: 78;
      display: none;
      pointer-events: none;
    }

    body[data-xq-screen="room"] #xiangqiRoomEntryOverlay,
    body.xq-room-entry-ready #xiangqiRoomEntryOverlay {
      display: block;
      pointer-events: auto;
    }

    .xiangqi-room-hit {
      position: absolute;
      left: 11%;
      width: 78%;
      height: 7.2%;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      color: transparent;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .xiangqi-room-hit[data-xq-room-index="0"] {
      top: 33.5%;
    }

    .xiangqi-room-hit[data-xq-room-index="1"] {
      top: 49%;
    }

    .xiangqi-room-hit[data-xq-room-index="2"] {
      top: 64.5%;
    }

    @media (orientation: landscape) {
      .xiangqi-room-hit[data-xq-room-index="0"] {
        top: 28.5%;
      }

      .xiangqi-room-hit[data-xq-room-index="1"] {
        top: 41.5%;
      }

      .xiangqi-room-hit[data-xq-room-index="2"] {
        top: 54.5%;
      }
    }

    .xiangqi-pay-modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.46);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .xiangqi-pay-modal.show {
      display: flex;
    }

    .xiangqi-pay-panel {
      width: min(320px, calc(100vw - 40px));
      border-radius: 12px;
      overflow: hidden;
      background: #fff8e6;
      border: 1px solid #d6a64d;
      box-shadow: 0 16px 38px rgba(45, 22, 4, 0.32);
      color: #3b230b;
    }

    .xiangqi-pay-title {
      padding: 16px 16px 8px;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
    }

    .xiangqi-pay-content {
      padding: 4px 20px 16px;
      text-align: center;
      font-size: 14px;
      line-height: 1.55;
      color: #69421a;
    }

    .xiangqi-pay-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid #ebd4a6;
    }

    .xiangqi-pay-actions button {
      height: 46px;
      border: 0;
      background: transparent;
      color: #6b4a1e;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
    }

    .xiangqi-pay-actions button + button {
      border-left: 1px solid #ebd4a6;
      color: #b45309;
      background: #fff0c2;
    }

    #xiangqiToast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
      z-index: 90;
      display: none;
      max-width: min(300px, calc(100vw - 48px));
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(17, 24, 39, 0.88);
      color: #fff;
      font: 600 14px/1.35 Arial, "Microsoft YaHei", sans-serif;
      text-align: center;
      transform: translateX(-50%);
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.28);
    }
  </style>
</head>
<body>
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="xiangqiPointsBadge">积分 <b id="xiangqiPointsValue">--</b></div>
  <div id="xiangqiPayModal" class="xiangqi-pay-modal" aria-hidden="true">
    <div class="xiangqi-pay-panel">
      <div id="xiangqiPayTitle" class="xiangqi-pay-title">确认消耗积分</div>
      <div id="xiangqiPayContent" class="xiangqi-pay-content"></div>
      <div class="xiangqi-pay-actions">
        <button id="xiangqiPayCancel" type="button">取消</button>
        <button id="xiangqiPayConfirm" type="button">确认</button>
      </div>
    </div>
  </div>
  <div id="xiangqiToast"></div>
  <div id="xiangqiTitle">象棋对弈</div>
  <div id="xiangqiHomeOverlay" aria-hidden="true">
    <div class="xiangqi-home-menu">
      <button class="xiangqi-home-button" type="button" data-xq-node="btn1"><span>对战</span></button>
      <button class="xiangqi-home-button" type="button" data-xq-node="btn2"><span>名局研习</span></button>
    </div>
  </div>
  <div id="xiangqiRoomEntryOverlay" aria-hidden="true">
    <button class="xiangqi-room-hit" type="button" data-xq-room-index="0"></button>
    <button class="xiangqi-room-hit" type="button" data-xq-room-index="1"></button>
    <button class="xiangqi-room-hit" type="button" data-xq-room-index="2"></button>
  </div>
  <div id="splash">象棋加载中...</div>

  <script>
    (function () {
      var storagePrefix = "xiangqi_h5_";
      var noop = function () {};
      var systemInfo = {
        brand: "web",
        model: "web",
        pixelRatio: window.devicePixelRatio || 1,
        screenWidth: window.innerWidth || 375,
        screenHeight: window.innerHeight || 667,
        windowWidth: window.innerWidth || 375,
        windowHeight: window.innerHeight || 667,
        platform: "web",
        system: "web",
        language: "zh_CN",
        version: "h5",
        SDKVersion: "h5"
      };

      function ok(options, data) {
        options = options || {};
        if (typeof options.success === "function") options.success(data || {});
        if (typeof options.complete === "function") options.complete(data || {});
      }

      function fail(options, error) {
        options = options || {};
        if (typeof options.fail === "function") options.fail(error || {});
        if (typeof options.complete === "function") options.complete(error || {});
      }

      function createNoopAd() {
        var ad = {
          show: function () {
            return Promise.resolve().then(function () {
              if (typeof ad._close === "function") {
                setTimeout(function () { ad._close({ isEnded: true }); }, 0);
              }
            });
          },
          load: function () { return Promise.resolve(); },
          hide: noop,
          destroy: noop,
          onLoad: function (cb) { if (typeof cb === "function") setTimeout(cb, 0); },
          offLoad: noop,
          onError: noop,
          offError: noop,
          onClose: function (cb) {
            if (typeof cb === "function") ad._close = cb;
          },
          offClose: noop
        };
        return ad;
      }

      window.wx = window.wx || {};
      var wx = window.wx;
      wx.getSystemInfoSync = wx.getSystemInfoSync || function () { return systemInfo; };
      wx.getSystemInfo = wx.getSystemInfo || function (options) { ok(options, systemInfo); };
      wx.getMenuButtonBoundingClientRect = wx.getMenuButtonBoundingClientRect || function () {
        return { left: 0, top: 0, right: 0, bottom: 0, width: 0, height: 0 };
      };
      wx.createCanvas = wx.createCanvas || function () { return document.createElement("canvas"); };
      wx.createImage = wx.createImage || function () { return new Image(); };
      wx.createInnerAudioContext = wx.createInnerAudioContext || function () {
        return {
          src: "",
          loop: false,
          autoplay: false,
          volume: 1,
          play: noop,
          pause: noop,
          stop: noop,
          destroy: noop,
          onCanplay: noop,
          onPlay: noop,
          onPause: noop,
          onStop: noop,
          onEnded: noop,
          onError: noop,
          offCanplay: noop,
          offPlay: noop,
          offPause: noop,
          offStop: noop,
          offEnded: noop,
          offError: noop
        };
      };
      wx.getStorageSync = wx.getStorageSync || function (key) {
        return localStorage.getItem(storagePrefix + key) || "";
      };
      wx.setStorageSync = wx.setStorageSync || function (key, value) {
        localStorage.setItem(storagePrefix + key, typeof value === "string" ? value : JSON.stringify(value));
      };
      wx.removeStorageSync = wx.removeStorageSync || function (key) {
        localStorage.removeItem(storagePrefix + key);
      };
      wx.clearStorageSync = wx.clearStorageSync || function () {
        Object.keys(localStorage)
          .filter(function (key) { return key.indexOf(storagePrefix) === 0; })
          .forEach(function (key) { localStorage.removeItem(key); });
      };
      wx.showToast = wx.showToast || function (options) {
        console.log("[xiangqi toast]", options && options.title ? options.title : "");
        ok(options);
      };
      wx.showLoading = wx.showLoading || function (options) { ok(options); };
      wx.hideLoading = wx.hideLoading || noop;
      wx.showModal = wx.showModal || function (options) {
        console.log("[xiangqi modal]", options && (options.title || options.content));
        ok(options, { confirm: true, cancel: false });
      };
      wx.login = wx.login || function (options) { ok(options, { code: "h5" }); };
      wx.getUserInfo = wx.getUserInfo || function (options) {
        ok(options, { userInfo: { nickName: "玩家", avatarUrl: "" } });
      };
      wx.request = wx.request || function (options) {
        options = options || {};
        fetch(options.url, {
          method: options.method || "GET",
          headers: options.header || {},
          body: options.data ? JSON.stringify(options.data) : undefined
        }).then(function (response) {
          return response.text().then(function (text) {
            var data = text;
            try { data = JSON.parse(text); } catch (_) {}
            ok(options, { statusCode: response.status, data: data });
          });
        }).catch(function (error) {
          fail(options, error);
        });
      };
      wx.createRewardedVideoAd = wx.createRewardedVideoAd || createNoopAd;
      wx.createBannerAd = wx.createBannerAd || createNoopAd;
      wx.createInterstitialAd = wx.createInterstitialAd || createNoopAd;
      wx.onShow = wx.onShow || noop;
      wx.offShow = wx.offShow || noop;
      wx.onHide = wx.onHide || noop;
      wx.offHide = wx.offHide || noop;
      wx.onError = wx.onError || noop;
      wx.offError = wx.offError || noop;
      wx.onShareAppMessage = wx.onShareAppMessage || noop;
      wx.shareAppMessage = wx.shareAppMessage || noop;
      wx.updateShareMenu = wx.updateShareMenu || function (options) { ok(options); };
      wx.showShareMenu = wx.showShareMenu || function (options) { ok(options); };
      wx.hideShareMenu = wx.hideShareMenu || function (options) { ok(options); };
      wx.vibrateShort = wx.vibrateShort || function (options) { ok(options); };
      wx.vibrateLong = wx.vibrateLong || function (options) { ok(options); };
      wx.exitMiniProgram = wx.exitMiniProgram || noop;

      window.__XQ_H5_READY__ = true;
    })();
  </script>

  <script>
    (function () {
      var state = {
        balance: null,
        paidUseCounts: {
          retract: 0,
          hint: 0
        },
        pendingDeduct: null,
        pendingPointChanges: {},
        actionBusy: false,
        roomEntryBusy: false,
        roomPointerGateUntil: 0,
        roomEntryCancelBlockUntil: 0,
        toastTimer: null,
        pendingStudyRewards: {},
        battleStake: null,
        roomEntryPass: null
      };
      var actionLabels = {
        retract: "悔棋",
        hint: "提示"
      };
      var ROOM_STAKES = {
        "\u5165\u95e8\u623f\u95f4": { key: "beginner", stake: 100, winReturn: 200 },
        "\u9ad8\u624b\u623f\u95f4": { key: "expert", stake: 300, winReturn: 600 },
        "\u56fd\u624b\u623f\u95f4": { key: "master", stake: 1000, winReturn: 2000 }
      };
      var ROOM_ORDER = ["\u5165\u95e8\u623f\u95f4", "\u9ad8\u624b\u623f\u95f4", "\u56fd\u624b\u623f\u95f4"];
      window.__xiangqiHasActiveBattleStake = function () {
        return !!(state.battleStake && !state.battleStake.settled);
      };
      var STUDY_REWARD_STORAGE_KEY = "xiangqi.study.rewardedLevels.v1";
      var STUDY_MAX_LEVEL = 240;

      function safeDisarmRoomEntryGuard() {
        window.__XQ_FORCE_ROOM_ENTRY_GUARD_UNTIL__ = 0;
        if (document.body && document.body.classList) {
          document.body.classList.remove("xq-room-entry-ready");
        }
        if (typeof window.__xiangqiDisarmRoomEntryGuard === "function") {
          try {
            window.__xiangqiDisarmRoomEntryGuard();
          } catch (_) {}
        }
      }

      function clearStaleBattleStakeForRoomEntry(roomName) {
        if (!state.battleStake || state.battleStake.settled) return;
        console.log("[xiangqi] clear stale battle stake before new room entry", {
          previousRoom: state.battleStake.roomName,
          nextRoom: roomName
        });
        state.battleStake.settled = true;
        state.battleStake = null;
        window.__XQ_NATIVE_ROOM_GUARD_SUPPRESS__ = false;
      }

      function authorizeRoomEntry(roomName, roundId) {
        state.roomEntryPass = {
          roomName: roomName,
          roundId: roundId || "",
          expiresAt: Date.now() + 4000,
          used: false
        };
        window.__XQ_ROOM_ENTRY_BYPASS__ = false;
      }

      function runAuthorizedRoomEntry(roomName, context, runner) {
        var pass = state.roomEntryPass;
        if (!pass || pass.used || pass.roomName !== roomName || Date.now() > pass.expiresAt) {
          state.roomEntryPass = null;
          window.__XQ_ROOM_ENTRY_BYPASS__ = false;
          window.__XQ_ROOM_ENTRY_AUTH_RUNNING__ = false;
          return false;
        }
        pass.used = true;
        state.roomEntryPass = null;
        window.__XQ_ROOM_ENTRY_BYPASS__ = false;
        window.__XQ_ROOM_ENTRY_AUTH_RUNNING__ = true;
        try {
          if (typeof runner === "function") runner.call(context);
        } catch (error) {
          console.error("[xiangqi] authorized room entry failed:", error);
        } finally {
          window.__XQ_ROOM_ENTRY_AUTH_RUNNING__ = false;
        }
        return true;
      }

      function getXqLabelTextFromNode(node) {
        if (!node || !window.cc || !cc.Label) return "";
        var text = "";
        var label = node.getComponent ? node.getComponent(cc.Label) : null;
        if (label && label.string) text += String(label.string);
        var children = node.children || [];
        for (var i = 0; i < children.length; i += 1) {
          var childLabel = children[i].getComponent ? children[i].getComponent(cc.Label) : null;
          if (childLabel && childLabel.string) text += " " + String(childLabel.string);
        }
        return text;
      }
      var getXLabelTextFromNode = getXqLabelTextFromNode;
      window.getXqLabelTextFromNode = getXqLabelTextFromNode;
      window.getXLabelTextFromNode = getXqLabelTextFromNode;

      function getXqNodeWorldY(node) {
        var y = 0;
        var cursor = node;
        var found = false;
        try {
          while (cursor) {
            if (cursor.isValid === false) break;
            if (isFinite(cursor.y)) {
              y += Number(cursor.y);
              found = true;
            }
            cursor = cursor.parent;
          }
        } catch (_) {}
        return found ? y : 0;
      }

      function xqNodeContains(parent, child) {
        var cursor = child;
        try {
          while (cursor) {
            if (cursor.isValid === false) return false;
            if (cursor === parent) return true;
            cursor = cursor.parent;
          }
        } catch (_) {}
        return false;
      }

      function getLikelyXqRoomButtons(root) {
        if (!root || !window.cc || !cc.Button) return [];
        var candidates = [];
        var skipName = /back|close|home|return|setting|sound|music|share|rank/i;
        var walk = function (node) {
          if (!node || node.isValid === false || (node.active === false && node.name !== "Canvas")) return;
          var button = null;
          try {
            button = node.getComponent ? node.getComponent(cc.Button) : null;
          } catch (_) {
            button = null;
          }
          if (button) {
            var width = Math.abs(Number(node.width || 0));
            var height = Math.abs(Number(node.height || 0));
            var name = String(node.name || "");
            if (!skipName.test(name) && width >= 180 && height >= 45) {
              candidates.push({
                node: node,
                y: getXqNodeWorldY(node),
                area: width * height,
                text: getXqLabelTextFromNode(node)
              });
            }
          }
          var children = [];
          try {
            children = node.children || [];
          } catch (_) {
            children = [];
          }
          for (var i = 0; i < children.length; i += 1) walk(children[i]);
        };
        walk(root);
        candidates = candidates.filter(function (item) {
          var text = String(item.text || "");
          return text.indexOf("\u5bf9\u6218") < 0 &&
            text.indexOf("\u540d\u5c40") < 0 &&
            text.indexOf("\u6094\u68cb") < 0 &&
            text.indexOf("\u63d0\u793a") < 0;
        });
        if (candidates.length < 3) return [];
        candidates.sort(function (a, b) {
          if (Math.abs(b.area - a.area) > 1200) return b.area - a.area;

        var width = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1);
        var height = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
        var xRatio = Number(clientX || 0) / width;

        var portrait = height > width;

              if (Number(result) === 0 && info && typeof window.__xiangqiAwardStudyLevel === "function") {
                window.__xiangqiAwardStudyLevel(info.level);
              } else if (!info && typeof window.__xiangqiSettleBattle === "function") {
                window.__xiangqiSettleBattle(result);
              }
            } catch (error) {
              console.warn("[xiangqi] study reward hook failed:", error);
            }
            return returnValue;
          };
          proto.__xiangqiStudyRewardHooked = true;
        } catch (error) {
          console.warn("[xiangqi] study reward install failed:", error);
        }
      }

      function syncHomeTitle() {
        var title = document.getElementById("xiangqiTitle");
        if (!title) return;
        var sceneName = "";
        var isHomeScene = false;
        var hasBattle = false;
        var hasStudyTitle = false;
        var hasRoomSelect = false;
        var hasStudySelect = false;
        var isGameScene = false;
        var hasHomeButton1 = false;
        var hasHomeButton2 = false;
        try {
          if (window.cc && cc.director && cc.director.getScene) {
            var scene = cc.director.getScene();
            sceneName = scene && scene.name ? scene.name : "";
            if (scene && window.cc && cc.Label) {
              var walk = function (node) {
                if (!node || (node.active === false && node.name !== "Canvas")) return;
                if (node.name === "btn1") hasHomeButton1 = true;
                if (node.name === "btn2") hasHomeButton2 = true;
                if (node.name === "btnhuiqi" || node.name === "btntishi") isGameScene = true;
                var label = node.getComponent ? node.getComponent(cc.Label) : null;
                if (label && label.string === "对战") hasBattle = true;
                if (label && label.string === "名局研习") hasStudyTitle = true;
                if (label && (label.string === "入门房间" || label.string === "高手房间" || label.string === "国手房间")) {
                  hasRoomSelect = true;
                }
                if (label && label.string === "后谱") hasStudySelect = true;
                if (label && (label.string === "悔棋" || label.string === "提示")) isGameScene = true;
                var children = node.children || [];
                for (var i = 0; i < children.length; i += 1) walk(children[i]);
              };
              walk(scene);
              if (!hasRoomSelect && getLikelyXqRoomButtons(scene).length >= 3) {
                hasRoomSelect = true;
              }
              isHomeScene = (hasBattle && hasStudyTitle) ||
                (hasHomeButton1 && hasHomeButton2 && !hasRoomSelect && !isGameScene);
            }
          }
        } catch (_) {}
        var showHome = sceneName === "GameLaunch" || isHomeScene;
        var screenMode = showHome ? "home" : (isGameScene ? "game" : (hasRoomSelect ? "room" : (hasStudySelect || hasStudyTitle ? "study" : "")));
        if (screenMode === "game" && syncHomeTitle.lastScreenMode !== "game" && typeof window.__xiangqiResetPaidActionCounts === "function") {
          window.__xiangqiResetPaidActionCounts();
        }
        syncHomeTitle.lastScreenMode = screenMode;
        title.style.display = showHome ? "flex" : "none";
        setHomeOverlayVisible(showHome);
        setScreenMode(screenMode);
      }

      function markSceneReadyIfPlayable() {
        if (window.__XQ_SCENE_READY__) return;
        var sceneName = "";
        var hasPlayableScene = false;
        try {
          if (window.cc && cc.director && cc.director.getScene) {
            var scene = cc.director.getScene();
            sceneName = scene && scene.name ? scene.name : "";
            if (scene) {
              var hasPlayableNode = false;
              var walk = function (node) {
                if (!node || hasPlayableNode || node.active === false) return;
                if (
                  node.name === "btn1" ||
                  node.name === "btn2" ||
                  node.name === "btnhuiqi" ||
                  node.name === "btntishi"
                ) {
                  hasPlayableNode = true;
                  return;
                }
                var label = window.cc && cc.Label && node.getComponent ? node.getComponent(cc.Label) : null;
                var text = label && label.string ? label.string : "";
                if (
                  text === "对战" ||
                  text === "名局研习" ||
                  text === "入门房间" ||
                  text === "高手房间" ||
                  text === "国手房间" ||
                  text === "后谱" ||
                  text === "悔棋" ||
                  text === "提示"
                ) {
                  hasPlayableNode = true;
                  return;
                }
                var children = node.children || [];
                for (var i = 0; i < children.length; i += 1) walk(children[i]);
              };
              walk(scene);
              hasPlayableScene = hasPlayableNode;
            }
          }
        } catch (_) {}
        if (!sceneName && !hasPlayableScene) return;
        if (sceneName === "Scene" && !hasPlayableScene) return;
        window.__XQ_SCENE_READY__ = true;
        fitCanvas();
        syncHomeTitle();
        setTimeout(hideSplash, 350);
      }

      window.addEventListener("resize", fitCanvas);
      window.addEventListener("orientationchange", function () {
        setTimeout(fitCanvas, 120);
      });
      window.addEventListener("error", function (event) {
        console.error("[xiangqi] runtime error", event.message);
        if (event.error && event.error.stack) console.error("[xiangqi] runtime stack", event.error.stack);
      });
      window.addEventListener("unhandledrejection", function (event) {
        console.error("[xiangqi] promise rejection", event.reason);
      });

      fitCanvas();
      bindHomeOverlay();

      loadScript("cocos/cocos2d-js-min.js?v=xq632", function () {
        fitCanvas();
        installCocosWorldMatrixGuard();
        if (typeof window.CC_PHYSICS_BUILTIN === "undefined") window.CC_PHYSICS_BUILTIN = false;
        if (typeof window.CC_PHYSICS_CANNON === "undefined") window.CC_PHYSICS_CANNON = false;
        if (typeof window.boot === "function") {
          window.__XQ_SCENE_READY__ = false;
          if (window.cc && cc.director && cc.Director) {
            cc.director.on(cc.Director.EVENT_AFTER_SCENE_LAUNCH, markSceneReadyIfPlayable);
          }
          try {
            window.boot();
          } catch (error) {
            console.error("[xiangqi] boot failed", error);
            showStartupError("象棋加载失败，请稍后重试");
            return;
          }
          setTimeout(installPaidActionGate, 600);
          setTimeout(installStudyRewardHook, 600);
          setTimeout(syncHomeTitle, 600);
          setTimeout(syncHomeTitle, 1200);
          setInterval(markSceneReadyIfPlayable, 300);
          setInterval(syncHomeTitle, 500);
          setInterval(installPaidActionGate, 1000);
          setInterval(installStudyRewardHook, 1000);
          setTimeout(function () {
            if (!window.__XQ_SCENE_READY__) showStartupError("象棋加载中...");
          }, 1800);
        } else if (splash) {
          splash.textContent = "象棋加载失败，请稍后重试";
        }
      });
    })();
  </script>
</body>
