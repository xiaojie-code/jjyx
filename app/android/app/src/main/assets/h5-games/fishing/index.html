<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>Cocos Creator | fishing</title>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->

        content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->

  <!--fix fireball/issues/3568 -->
  <!--<meta name="browsermode" content="application">-->

  <!--<link rel="apple-touch-icon" href=".png" />-->
  <!--<link rel="apple-touch-icon-precomposed" href=".png" />-->

  <link rel="stylesheet" type="text/css" href="style-mobile.25fc5.css?v=20260615-fullscreen"/>
  <link rel="icon" href="favicon.8de18.ico"/>
  <script>
    // H5 平台适配
    window.GamePlatform = window.GamePlatform || {};
    window.GamePlatform.H5 = 'H5';
    window.GamePlatform.weixin = 'weixin';
    window.GamePlatform.VIVO = 'VIVO';
    window.GamePlatform.zijietiaodong = 'zijietiaodong';
    window.GamePlatform.baidu = 'baidu';
    window.GamePlatform.QQ = 'QQ';
    window.GamePlatform.primordial = 'primordial';
    window.CC_PLATFORM = 'H5';

    // 确保本地有存档数据（防止首次进入时装备为 null 报错）
    // 游戏会从 localStorage 的 user_local_save_item 读取存档
    // 如果没有存档，loadUserSaveData 会创建默认装备
    // 但需要确保在 updateGameUIView 之前完成
    // 这里不预设数据，让游戏自己的 loadUserSaveData 处理
  </script>
</head>
<body>
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes">
      <span style="width: 0%"></span>
    </div>
  </div>

<script>
  (function () {
    var ACTIVE_SAVE_KEY = "user_local_save_item";
    var ACTIVE_SAVE_OWNER_KEY = "fishing_active_account";
    var appInitData = getInitialAppData();
    var pendingGold = null;
    var suppressGoldSync = false;
    var installed = false;
    var textPatchInstalled = false;
    var adPatchInstalled = false;
    var lastKnownGold = null;
    var nextGoldChangeReason = "";
    var lastAccountIdentity = "";
    var saveStoragePatched = false;
    var nativeStorageGetItem = null;
    var nativeStorageSetItem = null;
    var nativeStorageRemoveItem = null;
    var remoteSaveLoaded = false;
    var remoteSaveData = null;
    var suppressSaveUpload = false;
    var saveUploadTimer = null;
    var economyPatchInstalled = false;
    var ECONOMY_VERSION = 6;
    var FISHING_ENTRY_FEE = 500;
    var FISHING_DAILY_CAST_LIMIT = 50;
    var fishingEntryState = "idle";
    var fishingEntryOverlay = null;
    var fishingEntryFeeKnown = false;
    var fishingEntryFeeCharged = false;
    var fishingEntryFeeAmount = FISHING_ENTRY_FEE;
    var fishingDailyCastDate = "";
    var fishingDailyCastCount = 0;
    var fishingDailyCastRemaining = FISHING_DAILY_CAST_LIMIT;
    var fishingCastPatchInstalled = false;
    var fishingCastCounter = null;
    var goldSyncQueue = [];
    var goldSyncInFlight = null;
    var goldSyncFlushTimer = null;
    var goldSyncSequence = 0;
    var goldRenderTimer = null;

    function fitCocosCanvasToViewport() {
      var width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth || 0;
      var height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight || 0;
      if (!width || !height) return;
      var container = document.getElementById("Cocos2dGameContainer");
      var canvas = document.getElementById("GameCanvas");
      [document.documentElement, document.body, container, canvas].forEach(function (node) {
        if (!node || !node.style) return;
        node.style.width = width + "px";
        node.style.height = height + "px";
        node.style.margin = "0";
        node.style.padding = "0";
        if (node === container || node === canvas) {
          node.style.left = "0";
          node.style.top = "0";
        }
      });
      try {
        if (window.cc && cc.view) {
          cc.view.setFrameSize(width, height);
          cc.view.resizeWithBrowserSize(true);
        }
      } catch (_) {}
    }

    function getInitialAppData() {
      try {
        if (window.__GAME_APP_INIT__) return window.__GAME_APP_INIT__;
        if (window.__APP_GAME_INIT_MESSAGE__ && window.__APP_GAME_INIT_MESSAGE__.data) {
          return window.__APP_GAME_INIT_MESSAGE__.data;
        }
      } catch (error) {}
      return {};
    }

    function toNumber(value) {
      var num = Number(value);
      return isFinite(num) ? num : 0;
    }

    function postGameMessage(action, data) {
      try {
        if (
          window.flutter_inappwebview &&
          typeof window.flutter_inappwebview.callHandler === "function"
        ) {
          window.flutter_inappwebview.callHandler(
            "gameMessage",
            JSON.stringify({ action: action, data: data || {} })
          );
          return true;
        }
      } catch (error) {
        console.warn("[fishing] app bridge failed:", error);
      }
      return false;
    }

    function clearGoldSyncTimer(operation) {
      if (!operation || !operation.timeoutTimer) return;
      clearTimeout(operation.timeoutTimer);
      operation.timeoutTimer = null;
    }

    function scheduleGoldSyncFlush(delay) {
      if (goldSyncFlushTimer) clearTimeout(goldSyncFlushTimer);
      goldSyncFlushTimer = setTimeout(function () {
        goldSyncFlushTimer = null;
        flushGoldSyncQueue();
      }, typeof delay === "number" ? delay : 120);
    }

    function sendGoldSyncOperation(operation) {
      if (!operation) return;
      goldSyncInFlight = operation;
      operation.attempts += 1;
      clearGoldSyncTimer(operation);
      operation.timeoutTimer = setTimeout(function () {
        if (goldSyncInFlight !== operation) return;
        console.warn("[fishing] points request timed out", operation.requestId);
        goldSyncInFlight = null;
        if (operation.attempts < 2) {
          goldSyncQueue.unshift(operation);
        }
        scheduleGoldSyncFlush(operation.attempts < 2 ? 800 : 180);
      }, 8000);
      if (!postGameMessage("changePoints", {
        amount: operation.amount,
        reason: operation.reason,
        requestId: operation.requestId,
        module: "fishing"
      })) {
        clearGoldSyncTimer(operation);
        goldSyncInFlight = null;
        if (operation.attempts < 2) goldSyncQueue.unshift(operation);
        scheduleGoldSyncFlush(800);
      }
    }

    function flushGoldSyncQueue() {
      if (goldSyncInFlight || goldSyncQueue.length === 0) return;
      sendGoldSyncOperation(goldSyncQueue.shift());
    }

    function syncGoldDelta(delta, reason) {
      delta = Math.trunc(toNumber(delta));
      if (!delta) return;
      reason = reason || (delta > 0 ? "fishing_points_earn" : "fishing_points_spend");
      var tail = goldSyncQueue.length ? goldSyncQueue[goldSyncQueue.length - 1] : null;
      if (
        tail &&
        tail.reason === reason &&
        ((tail.amount > 0 && delta > 0) || (tail.amount < 0 && delta < 0))
      ) {
        tail.amount += delta;
      } else {
        goldSyncQueue.push({
          amount: delta,
          reason: reason,
          requestId: "fishing_points_" + Date.now() + "_" + (++goldSyncSequence),
          attempts: 0,
          timeoutTimer: null
        });
      }
      scheduleGoldSyncFlush(120);
    }

    function handleGoldSyncResult(data) {
      var operation = goldSyncInFlight;
      if (!operation || !data || String(data.requestId || "") !== operation.requestId) {
        return false;
      }
      clearGoldSyncTimer(operation);
      goldSyncInFlight = null;
      if (data.success === false && operation.attempts < 2) {
        goldSyncQueue.unshift(operation);
        scheduleGoldSyncFlush(800);
      } else {
        scheduleGoldSyncFlush(120);
      }
      return true;
    }

    function resetGoldSyncQueue() {
      if (goldSyncFlushTimer) clearTimeout(goldSyncFlushTimer);
      goldSyncFlushTimer = null;
      if (goldRenderTimer) clearTimeout(goldRenderTimer);
      goldRenderTimer = null;
      clearGoldSyncTimer(goldSyncInFlight);
      goldSyncInFlight = null;
      goldSyncQueue = [];
    }

    function scaleEconomyValue(value) {
      var num = toNumber(value);
      if (num <= 0) return 0;
      if (num < 100) return Math.max(1, Math.floor(num));
      return Math.max(10, Math.floor(num / 100) * 10);
    }

    var FISH_REWARD_MAX_POINTS = 500;

    function capFishRewardValue(value) {
      return Math.min(FISH_REWARD_MAX_POINTS, value);
    }

    function scaleFishRewardValue(value) {
      var num = toNumber(value);
      if (num <= 0) return 0;
      if (num < 100) return capFishRewardValue(Math.max(1, Math.floor(num)));
      if (num >= 10000) return capFishRewardValue(Math.max(100, Math.floor(num / 100)));
      return capFishRewardValue(Math.max(10, Math.floor(num / 10)));
    }

    function normalizeStoredFishRewardValue(value) {
      var num = toNumber(value);
      if (num <= 0) return 0;
      if (num < 1000) return capFishRewardValue(Math.floor(num));
      return scaleFishRewardValue(num);
    }

    function shouldPreserveFishingLevelField(key) {
      var normalized = String(key || "").toLowerCase();
      return /(^|_)(skill|bait|net|craft|rod|hook|rope).*(_|)(lv|level)$/.test(normalized) ||
        /(skill|bait|net|craft|rod|hook|rope).*(lv|level)/.test(normalized) ||
        /^lv(el)?$/.test(normalized);
    }

    function mergeFishingProgress(prev, next, key) {
      if (Array.isArray(prev) && Array.isArray(next)) {
        return next.map(function (item, index) {
          return mergeFishingProgress(prev[index], item, key);
        });
      }
      if (prev && next && typeof prev === "object" && typeof next === "object" && !Array.isArray(prev) && !Array.isArray(next)) {
        var merged = Object.assign({}, next);
        Object.keys(prev).forEach(function (childKey) {
          if (Object.prototype.hasOwnProperty.call(next, childKey)) {
            merged[childKey] = mergeFishingProgress(prev[childKey], next[childKey], childKey);
          }
        });
        return merged;
      }
      if (shouldPreserveFishingLevelField(key)) {
        var prevNumber = Number(prev);
        var nextNumber = Number(next);
        if (isFinite(prevNumber) && isFinite(nextNumber) && prevNumber > nextNumber) {
          return prev;
        }
      }
      return next;
    }

    function hasRealAccountData() {
      return !!(appInitData && (appInitData.userId || appInitData.account || appInitData.token));
    }

    function getAccountIdentity() {
      if (!hasRealAccountData()) return "";
      return String(appInitData.userId || appInitData.account || appInitData.token)
        .replace(/[^a-zA-Z0-9_.-]/g, "_");
    }

    function getScopedSaveKey() {
      var account = getAccountIdentity();
      return account ? ACTIVE_SAVE_KEY + ":" + account : "";
    }

    function activateAccountSave() {
      var scopedKey = getScopedSaveKey();
      if (!scopedKey || scopedKey === lastAccountIdentity) return;
      var account = getAccountIdentity();
      var scopedSave = localStorage.getItem(scopedKey);
      if (scopedSave) {
        localStorage.setItem(ACTIVE_SAVE_KEY, scopedSave);
      } else {
        var activeOwner = localStorage.getItem(ACTIVE_SAVE_OWNER_KEY);
        var activeSave = localStorage.getItem(ACTIVE_SAVE_KEY);
        if (activeSave && (!activeOwner || activeOwner === account)) {
          localStorage.setItem(scopedKey, activeSave);
        } else {
          localStorage.removeItem(ACTIVE_SAVE_KEY);
        }
      }
      if (account) {
        localStorage.setItem(ACTIVE_SAVE_OWNER_KEY, account);
      }
      lastAccountIdentity = scopedKey;
    }

    function mirrorActiveSaveToAccount() {
      var scopedKey = getScopedSaveKey();
      if (!scopedKey) return;
      var raw = localStorage.getItem(ACTIVE_SAVE_KEY);
      if (raw) {
        localStorage.setItem(scopedKey, raw);
        localStorage.setItem(ACTIVE_SAVE_OWNER_KEY, getAccountIdentity());
      }
    }

    function getTodayString() {
      var now = new Date();
      var y = now.getFullYear();
      var m = String(now.getMonth() + 1).padStart(2, "0");
      var d = String(now.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + d;
    }

    function dailyRewardKey() {
      var account = getAccountIdentity() || "guest";
      return "fishing_daily_login_reward:" + account + ":" + getTodayString();
    }

    function balanceFromData(data, fallback) {
      if (typeof data.points !== "undefined") return data.points;
      if (typeof data.balance !== "undefined") return data.balance;
      if (typeof data.coin !== "undefined") return data.coin;
      return typeof fallback !== "undefined" ? fallback : 0;
    }

    function updateFishingCastState(data) {
      if (!data || typeof data !== "object") return;
      if (typeof data.dailyCastLimit !== "undefined") {
        FISHING_DAILY_CAST_LIMIT = Math.max(1, Math.floor(toNumber(data.dailyCastLimit)) || FISHING_DAILY_CAST_LIMIT);
      }
      if (typeof data.dailyCastDate !== "undefined") {
        fishingDailyCastDate = String(data.dailyCastDate || "");
      } else if (!fishingDailyCastDate) {
        fishingDailyCastDate = getTodayString();
      }
      if (typeof data.dailyCastCount !== "undefined") {
        fishingDailyCastCount = Math.max(0, Math.floor(toNumber(data.dailyCastCount)));
      }
      if (typeof data.dailyCastRemaining !== "undefined") {
        fishingDailyCastRemaining = Math.max(0, Math.floor(toNumber(data.dailyCastRemaining)));
      } else {
        fishingDailyCastRemaining = Math.max(0, FISHING_DAILY_CAST_LIMIT - fishingDailyCastCount);
      }
      updateFishingCastCounter();
    }

    function ensureFishingCastCounter() {
      if (fishingCastCounter && fishingCastCounter.parentNode) return fishingCastCounter;
      var styleId = "fishing-daily-cast-counter-style";
      if (!document.getElementById(styleId)) {
        var style = document.createElement("style");
        style.id = styleId;
        style.textContent =
          "#fishing-daily-cast-counter{position:fixed;left:68.5%;top:4%;transform:translateX(-50%);z-index:2147483000;width:clamp(128px,22vh,164px);padding:6px 9px 7px;box-sizing:border-box;border:1px solid rgba(149,235,225,.5);border-radius:6px;background:rgba(5,38,52,.78);box-shadow:0 3px 10px rgba(0,18,28,.28);color:#fff;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .16s ease;}" +
          "#fishing-daily-cast-counter.is-visible{opacity:1;visibility:visible;}" +
          "#fishing-daily-cast-counter .cast-row{display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;line-height:18px;}" +
          "#fishing-daily-cast-counter .cast-label{font-size:12px;font-weight:600;color:#d9f8f3;}" +
          "#fishing-daily-cast-counter .cast-value{font-size:15px;font-weight:800;color:#58d7c8;font-variant-numeric:tabular-nums;}" +
          "#fishing-daily-cast-counter .cast-track{height:3px;margin-top:4px;overflow:hidden;border-radius:2px;background:rgba(255,255,255,.2);}" +
          "#fishing-daily-cast-counter .cast-progress{display:block;width:0;height:100%;border-radius:2px;background:#58d7c8;transition:width .2s ease,background-color .2s ease;}" +
          "#fishing-daily-cast-counter.is-warning{border-color:rgba(255,184,77,.58);}" +
          "#fishing-daily-cast-counter.is-warning .cast-value{color:#ffb84d;background:transparent;}" +
          "#fishing-daily-cast-counter.is-warning .cast-progress{background:#ffb84d;}" +
          "#fishing-daily-cast-counter.is-full{border-color:rgba(255,107,94,.68);}" +
          "#fishing-daily-cast-counter.is-full .cast-value{color:#ff6b5e;background:transparent;}" +
          "#fishing-daily-cast-counter.is-full .cast-progress{background:#ff6b5e;}";
        document.head.appendChild(style);
      }
      var counter = document.createElement("div");
      counter.id = "fishing-daily-cast-counter";
      counter.setAttribute("aria-label", "今日抛竿次数");
      counter.innerHTML =
        '<div class="cast-row"><span class="cast-label">今日抛竿</span><strong class="cast-value">0/50</strong></div>' +
        '<div class="cast-track"><i class="cast-progress"></i></div>';
      document.body.appendChild(counter);
      fishingCastCounter = counter;
      return counter;
    }

    function hasActiveFishingDialog() {
      var canvas = getFishingCanvas();
      if (!canvas) return true;
      var blockedComponents = [
        "FishMarketPanel",
        "FishShopPanle",
        "UserPackagePanle",
        "SceneChanePanel",
        "RankingPanel",
        "TipsView",
        "UpdateSkillDlg",
        "GarbageView",
        "SystemNoticeView"
      ];
      var blocked = false;
      walkNode(canvas, function (node) {
        if (blocked || !node || node.active === false || node.activeInHierarchy === false) return;
        if (node.name === "__PopWait__") {
          blocked = true;
          return;
        }
        if (typeof node.getComponent !== "function") return;
        for (var i = 0; i < blockedComponents.length; i++) {
          try {
            if (node.getComponent(blockedComponents[i])) {
              blocked = true;
              return;
            }
          } catch (_) {}
        }
      });
      return blocked;
    }

    function isFishingCastCounterVisible() {
      if (!hasRealAccountData()) return false;
      if (fishingEntryOverlay && fishingEntryOverlay.style.display !== "none") return false;
      var splash = document.getElementById("splash");
      if (splash) {
        var style = window.getComputedStyle ? window.getComputedStyle(splash) : splash.style;
        if (style && style.display !== "none" && style.visibility !== "hidden" && style.opacity !== "0") {
          return false;
        }
      }
      if (pendingGold === null && lastKnownGold === null) return false;
      return !hasActiveFishingDialog();
    }

    function updateFishingCastCounter() {
      var counter = ensureFishingCastCounter();
      var limit = Math.max(1, Math.floor(toNumber(FISHING_DAILY_CAST_LIMIT)) || 50);
      var count = Math.max(0, Math.floor(toNumber(fishingDailyCastCount)));
      var ratio = Math.min(1, count / limit);
      var value = counter.querySelector(".cast-value");
      var progress = counter.querySelector(".cast-progress");
      if (value) value.textContent = count + "/" + limit;
      if (progress) progress.style.width = (ratio * 100) + "%";
      counter.classList.toggle("is-warning", ratio >= 0.8 && ratio < 1);
      counter.classList.toggle("is-full", ratio >= 1);
      counter.classList.toggle("is-visible", isFishingCastCounterVisible());
    }

    function getLocalCastStateKey() {
      return "fishing_daily_cast:" + (getAccountIdentity() || "guest") + ":" + getTodayString();
    }

    function loadLocalCastState() {
      try {
        var raw = rawGetItem(getLocalCastStateKey());
        if (!raw) return;
        var local = JSON.parse(raw);
        updateFishingCastState({
          dailyCastDate: getTodayString(),
          dailyCastLimit: local.limit || FISHING_DAILY_CAST_LIMIT,
          dailyCastCount: local.count || 0,
          dailyCastRemaining: Math.max(0, (local.limit || FISHING_DAILY_CAST_LIMIT) - (local.count || 0))
        });
      } catch (_) {}
    }

    function saveLocalCastState() {
      try {
        rawSetItem(getLocalCastStateKey(), JSON.stringify({
          date: getTodayString(),
          limit: FISHING_DAILY_CAST_LIMIT,
          count: fishingDailyCastCount,
          updatedAt: new Date().toISOString()
        }));
      } catch (_) {}
    }

    function showFishingCastLimitMessage(message) {
      var text = message || ("今日钓鱼次数已用完（" + FISHING_DAILY_CAST_LIMIT + "次），请明天再来");
      if (window.CommonResManager && typeof window.CommonResManager.ShowToast === "function") {
        window.CommonResManager.ShowToast(text, 2);
      } else {
        alert(text);
      }
    }

    function claimFishingCastLocally() {
      if (fishingDailyCastDate !== getTodayString()) {
        fishingDailyCastDate = getTodayString();
        fishingDailyCastCount = 0;
        fishingDailyCastRemaining = FISHING_DAILY_CAST_LIMIT;
        updateFishingCastCounter();
      }
      if (fishingDailyCastCount >= FISHING_DAILY_CAST_LIMIT) {
        return false;
      }
      fishingDailyCastCount += 1;
      fishingDailyCastRemaining = Math.max(0, FISHING_DAILY_CAST_LIMIT - fishingDailyCastCount);
      saveLocalCastState();
      updateFishingCastCounter();
      return true;
    }

    window.__jjyxFishingTryCast = function () {
      var path = getApiPath("/fishing/cast");
      var data = sendApiJsonSync("POST", path);
      if (data) {
        updateFishingCastState(data);
        saveLocalCastState();
        if (data.allowed === false) {
          showFishingCastLimitMessage(data.message);
          return false;
        }
        return true;
      }
      if (!claimFishingCastLocally()) {
        showFishingCastLimitMessage();
        return false;
      }
      return true;
    };

    function installFishingCastLimitPatch() {
      if (fishingCastPatchInstalled || !window.cc || !cc.Node || !cc.Node.prototype || !cc.Node.prototype.on) return;
      var originalOn = cc.Node.prototype.on;
      cc.Node.prototype.on = function patchedFishingNodeOn(type, callback, target, useCapture) {
        if (type === "touchstart" && typeof callback === "function" && !callback.__jjyxFishingCastWrapped) {
          var originalCallback = callback;
          callback = function patchedFishingTouchStart() {
            var gameComponent = target || this;
            if (
              gameComponent &&
              typeof gameComponent._game_state !== "undefined" &&
              gameComponent.fish_float &&
              gameComponent.fish_rope_node &&
              Number(gameComponent._game_state) === 0
            ) {
              try {
                if (window.UserBaseInfo && typeof window.UserBaseInfo.isGoFishing === "function") {
                  if (window.UserBaseInfo.isGoFishing() !== -1) {
                    return originalCallback.apply(this, arguments);
                  }
                }
                var event = arguments[0];
                if (
                  event &&
                  event.currentTouch &&
                  gameComponent.node &&
                  typeof gameComponent.node.convertTouchToNodeSpaceAR === "function"
                ) {
                  var point = gameComponent.node.convertTouchToNodeSpaceAR(event.currentTouch);
                  if (point && (point.x < -500 || point.x > 500)) {
                    return originalCallback.apply(this, arguments);
                  }
                }
              } catch (_) {}
              if (window.__jjyxFishingTryCast && window.__jjyxFishingTryCast() === false) {
                return;
              }
            }
            return originalCallback.apply(this, arguments);
          };
          Object.defineProperty(callback, "__jjyxFishingCastWrapped", { value: true });
        }
        return originalOn.call(this, type, callback, target, useCapture);
      };
      Object.defineProperty(cc.Node.prototype.on, "__jjyxFishingCastLimitPatched", { value: true });
      fishingCastPatchInstalled = true;
    }

    function exitFishingGame() {
      postGameMessage("exitGame", { source: "fishing_entry_fee" });
    }

    function ensureFishingEntryOverlay() {
      if (fishingEntryOverlay) return fishingEntryOverlay;
      var overlay = document.createElement("div");
      overlay.id = "fishing-entry-fee-overlay";
      overlay.style.cssText = [
        "position:fixed",
        "inset:0",
        "z-index:2147483647",
        "display:none",
        "align-items:center",
        "justify-content:center",
        "padding:24px",
        "background:rgba(8,18,32,.56)",
        "backdrop-filter:blur(8px)",
        "-webkit-backdrop-filter:blur(8px)",
        "box-sizing:border-box"
      ].join(";");
      overlay.innerHTML =

    function unwrapApiResponse(payload) {
      if (payload && typeof payload === "object" && Object.prototype.hasOwnProperty.call(payload, "data")) {
        return payload.data;

    function sendApiJsonSync(method, path, body) {
      var token = getAuthToken();
      if (!path || !token || !window.XMLHttpRequest) return null;
      try {
        var xhr = new XMLHttpRequest();
        xhr.open(method, path, false);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.setRequestHeader("Accept", "application/json");
        xhr.setRequestHeader("Authorization", "Bearer " + token);
        xhr.send(body ? JSON.stringify(body) : null);
        if (xhr.status < 200 || xhr.status >= 300) {
          console.warn("[fishing] api sync failed:", method, path, xhr.status, xhr.responseText);
          return null;
        }
        var parsed = xhr.responseText ? JSON.parse(xhr.responseText) : null;
        if (parsed && typeof parsed.code !== "undefined" && parsed.code !== 0) {
          console.warn("[fishing] api sync code failed:", parsed);
          return null;
        }
        return unwrapApiResponse(parsed);
      } catch (error) {
        console.warn("[fishing] api sync error:", method, path, error);
        return null;
      }
    }

    function sendApiJsonAsync(method, path, body) {
      var token = getAuthToken();
      if (!path || !token || !window.fetch) return Promise.resolve(null);
      return fetch(path, {
        method: method,
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json",
          "Authorization": "Bearer " + token,
        },
        body: body ? JSON.stringify(body) : undefined,
      }).then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      }).then(function (payload) {
        if (payload && typeof payload.code !== "undefined" && payload.code !== 0) {
          throw new Error(payload.message || "api failed");
        }
        return unwrapApiResponse(payload);
      }).catch(function (error) {
        console.warn("[fishing] api async error:", method, path, error);
        return null;
      });
    }

    function normalizeSaveForRuntime(saveData, balance, dailyClaimed) {
      if (!saveData || typeof saveData !== "object") return null;

      if (typeof balance !== "undefined" && balance !== null) {
        save.gold = Math.max(0, Math.floor(toNumber(balance)));
      }
      if (dailyClaimed === true) {
        save.isGetGold = true;
        save.fishingDailyRewardDate = getTodayString();
      } else if (dailyClaimed === false && save.fishingDailyRewardDate !== getTodayString()) {
        save.isGetGold = false;

      migrateFishingSaveEconomy(save);

      var save = normalizeSaveForRuntime(saveData, balance, dailyClaimed);

      suppressSaveUpload = true;
      try {
        rawSetItem(ACTIVE_SAVE_KEY, JSON.stringify(save));
        mirrorActiveSaveToAccount();
      } finally {
        suppressSaveUpload = false;
      }

        return;
      }
      suppressGoldSync = true;
      suppressSaveUpload = true;

    function loadRemoteSaveSync(force) {
      if (remoteSaveLoaded && !force) return remoteSaveData;
      remoteSaveLoaded = true;
      var path = getApiPath("/save");
      var data = sendApiJsonSync("GET", path);
      if (!data) return remoteSaveData;

      pendingGold = Math.max(0, Math.floor(toNumber(balanceFromData(data, pendingGold || 0))));
      lastKnownGold = pendingGold;
      updateFishingCastState(data);
      saveLocalCastState();
      clearDailyRewardLocalIfNeeded(data.dailyClaimed === true);
      if (data.dailyClaimed === true) {
        markDailyRewardLocal(0, pendingGold, true);
      }

      if (data.saveData) {
        remoteSaveData = writeActiveSaveFromRemote(data.saveData, pendingGold, data.dailyClaimed === true);
        return remoteSaveData;
      }

      updateLocalSaveGold(pendingGold);
      return remoteSaveData;
    }

    function uploadActiveSave(rawValue) {
      if (suppressSaveUpload) return;
      var path = getApiPath("/save");
      if (!path || !getAuthToken()) return;
      if (!remoteSaveLoaded || pendingGold === null) return;
      var saveData = null;
      try {
        saveData = typeof rawValue === "string" ? JSON.parse(rawValue) : rawValue;
      } catch (error) {
        console.warn("[fishing] parse save for upload failed:", error);
        return;
      }
      if (!saveData || typeof saveData !== "object") return;
      if (remoteSaveData) {
        saveData = mergeFishingProgress(remoteSaveData, saveData);
      }

      if (saveUploadTimer) clearTimeout(saveUploadTimer);
      saveUploadTimer = setTimeout(function () {
        sendApiJsonAsync("POST", path, { saveData: saveData }).then(function (data) {
          if (!data) return;
          var balance = balanceFromData(data, pendingGold || saveData.gold || 0);
          pendingGold = Math.max(0, Math.floor(toNumber(balance)));
          lastKnownGold = pendingGold;
          updateFishingCastState(data);
          saveLocalCastState();
          if (data.saveData) {
            remoteSaveData = writeActiveSaveFromRemote(data.saveData, pendingGold, data.dailyClaimed === true);
          }
        });
      }, 900);
    }

    function installSaveStoragePatch() {

      nativeStorageSetItem = Storage.prototype.setItem;
      nativeStorageRemoveItem = Storage.prototype.removeItem;

      Storage.prototype.getItem = function patchedGetItem(key) {

      Storage.prototype.setItem = function patchedSetItem(key, value) {

        if (this === localStorage && key === ACTIVE_SAVE_KEY) {

        return result;

    function walkNode(node, visitor) {
      if (!node) return;
      visitor(node);

      for (var i = 0; i < children.length; i++) {

    function removeFishingWaitNodes(canvas) {
      getFishingWaitNodes(canvas).forEach(function (node) {

    function installFishingPopWaitPatch() {
      var manager = window.CommonResManager;
      if (!manager || !window.cc || !cc.loader) return false;
      if (manager.__jjyxPopWaitPatched) {
        if (typeof manager.__jjyxNormalizePopWait === "function") {
          manager.__jjyxNormalizePopWait();
        }
        return true;
      }

      var initialNodes = getFishingWaitNodes(getFishingCanvas());
      var waitDepth = initialNodes.length;
      var loadingPrefab = false;
      var loadToken = 0;
      var safetyTimer = null;

      function makeWaitNodeRecoverable(node) {
        if (!node || node.__jjyxWaitRecoverable) return;
        node.__jjyxWaitRecoverable = true;
        node.__jjyxCanDismiss = false;
        try {
          node.on("touchend", function () {
            if (!node.__jjyxCanDismiss) return;
            manager.__jjyxForceHidePopWait("manual");
          });
        } catch (_) {}
        setTimeout(function () {
          if (!node.parent || waitDepth <= 0) return;
          node.__jjyxCanDismiss = true;
          try {
            var waitView = node.getComponent("PopWaitCrl");
            if (waitView && waitView.game_tip) {
              waitView.enabled = false;
              waitView.game_tip.string = "加载时间较长，点击屏幕返回游戏";
            }
          } catch (_) {}
        }, 3000);
      }

      function collapseDuplicateWaitNodes() {
        var canvas = getFishingCanvas();
        var nodes = getFishingWaitNodes(canvas);
        if (waitDepth <= 0) {
          removeFishingWaitNodes(canvas);
          return;
        }
        for (var i = 1; i < nodes.length; i++) {
          try {
            nodes[i].removeFromParent(false);
            nodes[i].destroy();
          } catch (_) {}
        }
        if (nodes[0]) makeWaitNodeRecoverable(nodes[0]);
      }

      function armSafetyTimer() {
        if (safetyTimer) clearTimeout(safetyTimer);
        safetyTimer = setTimeout(function () {
          if (waitDepth <= 0) return;
          console.warn("[fishing] loading overlay timed out and was cleared");
          manager.__jjyxForceHidePopWait("timeout");
        }, 8000);
      }

      manager.ShowPopWait = function patchedShowPopWait() {
        waitDepth += 1;
        armSafetyTimer();
        var canvas = getFishingCanvas();
        var nodes = getFishingWaitNodes(canvas);
        if (nodes.length > 0) {
          nodes[0].active = true;
          collapseDuplicateWaitNodes();
          return;
        }
        if (!canvas || loadingPrefab) return;
        loadingPrefab = true;
        var token = ++loadToken;
        cc.loader.loadRes("prefab/Pop_wait", cc.Prefab, function (error, prefab) {
          loadingPrefab = false;
          if (error || !prefab || token !== loadToken || waitDepth <= 0) return;
          var currentCanvas = getFishingCanvas();
          if (!currentCanvas) return;
          var currentNodes = getFishingWaitNodes(currentCanvas);
          if (currentNodes.length === 0) {
            var waitNode = cc.instantiate(prefab);
            waitNode.name = "__PopWait__";
            waitNode.setParent(currentCanvas);
          }
          collapseDuplicateWaitNodes();
        });
      };

      manager.HidePopWait = function patchedHidePopWait() {
        waitDepth = Math.max(0, waitDepth - 1);
        if (waitDepth > 0) return;
        loadToken += 1;
        loadingPrefab = false;
        if (safetyTimer) {
          clearTimeout(safetyTimer);
          safetyTimer = null;
        }
        removeFishingWaitNodes(getFishingCanvas());
      };

      manager.__jjyxNormalizePopWait = collapseDuplicateWaitNodes;
      manager.__jjyxForceHidePopWait = function () {
        var reason = arguments[0];
        waitDepth = 0;
        loadToken += 1;
        loadingPrefab = false;
        if (safetyTimer) {
          clearTimeout(safetyTimer);
          safetyTimer = null;
        }
        removeFishingWaitNodes(getFishingCanvas());
        if (reason) {
          setTimeout(function () {
            try {
              manager.ShowToast(
                reason === "timeout"
                  ? "加载超时，已返回游戏，请重新操作"
                  : "已返回游戏"
              );
            } catch (_) {}
          }, 0);
        }
      };
      manager.__jjyxPopWaitPatched = true;
      if (waitDepth > 0) armSafetyTimer();
      collapseDuplicateWaitNodes();
      return true;
    }

      window.CreateFishInfoForID = function patchedCreateFishInfoForID() {
        var fish = originalCreateFishInfoForID.apply(this, arguments);
        if (fish && typeof fish.getFishPrice === "function" && !fish.__jjyxEconomyPatched) {
          var originalGetFishPrice = fish.getFishPrice.bind(fish);
          fish.getFishPrice = function patchedGetFishPrice() {
            return scaleFishRewardValue(originalGetFishPrice());
          };
          Object.defineProperty(fish, "__jjyxEconomyPatched", { value: true });
        }
        return fish;
      };
      Object.defineProperty(window.CreateFishInfoForID, "__jjyxEconomyPatched", { value: true });
    }

    function patchUserEconomyMethods() {
      if (!window.UserBaseInfo || window.UserBaseInfo.__jjyxEconomyPatched) return;

      if (typeof window.UserBaseInfo.getGiftGlod === "function") {
        var originalGetGiftGlod = window.UserBaseInfo.getGiftGlod.bind(window.UserBaseInfo);
        window.UserBaseInfo.getGiftGlod = function patchedGetGiftGlod() {
          return scaleEconomyValue(originalGetGiftGlod());
        };
      }

      if (typeof window.UserBaseInfo.sellGarbageItem === "function") {
        var originalSellGarbageItem = window.UserBaseInfo.sellGarbageItem.bind(window.UserBaseInfo);
        window.UserBaseInfo.sellGarbageItem = function patchedSellGarbageItem(gold) {
          nextGoldChangeReason = "fish_sell";
          try {
            return originalSellGarbageItem(scaleEconomyValue(gold));
          } finally {
            setTimeout(function () {
              if (nextGoldChangeReason === "fish_sell") nextGoldChangeReason = "";
            }, 0);
          }
        };
      }

      var shouldMigrateMemory = migrateActiveFishingSaveEconomy();
      if (shouldMigrateMemory && typeof window.UserBaseInfo.getFishItems === "function") {
        var fishItems = window.UserBaseInfo.getFishItems();
        if (Array.isArray(fishItems)) {
          fishItems.forEach(function (item) {
            if (item && typeof item.price !== "undefined") {
              item.price = scaleEconomyValue(item.price);
            }
          });
        }
      }

      for (var type = 0; type <= 5; type += 1) {
        if (typeof window.UserBaseInfo.getUserPackageItems === "function") {
          var packageItems = window.UserBaseInfo.getUserPackageItems(type);
          if (Array.isArray(packageItems)) {
            packageItems.forEach(scaleLoadedItemPrice);
          }
        }
      }
      [
        "getUseBaitItem",
        "getUseRodItem",
        "getUseHookItem",
        "getUseRopeItem",
        "getUseNetItem",
      ].forEach(function (method) {
        if (typeof window.UserBaseInfo[method] !== "function") return;
        var userItem = window.UserBaseInfo[method]();
        if (userItem && typeof userItem.getItemInfo === "function") {
          scaleLoadedItemPrice(userItem.getItemInfo());
        }
        if (userItem && typeof userItem.getItemAttribute === "function") {
          scaleAttributePrice(userItem.getItemAttribute());
        }
      });
      if (typeof window.UserBaseInfo.getUseBoxItem === "function") {
        scaleLoadedItemPrice(window.UserBaseInfo.getUseBoxItem());
      }

      Object.defineProperty(window.UserBaseInfo, "__jjyxEconomyPatched", { value: true });
    }

    function scaleAttributePrice(attribute) {
      if (!attribute || typeof attribute.price === "undefined" || attribute.__jjyxEconomyScaled) {
        return;
      }
      attribute.price = scaleEconomyValue(attribute.price);
      Object.defineProperty(attribute, "__jjyxEconomyScaled", { value: true });
    }

    function scaleLoadedItemPrice(item) {
      if (!item) return;
      scaleAttributePrice(item.itemAttribute);
      if (typeof item.price !== "undefined" && !item.__jjyxEconomyScaled) {
        item.price = scaleEconomyValue(item.price);
        Object.defineProperty(item, "__jjyxEconomyScaled", { value: true });
      }
    }

    function installEconomyPatch() {
      scaleItemPrices(window.ITEM_INFOS);
      scaleSkillCosts();
      scaleSceneCosts();
      scaleTaskRewards();
      patchFishPriceFactory();
      patchUserEconomyMethods();

      if (
        window.ITEM_INFOS &&
        window.SKILL_BASE_INFO &&
        window.UserBaseInfo &&
        typeof window.CreateFishInfoForID === "function" &&
        typeof window.getTaskForID === "function"
      ) {
        economyPatchInstalled = true;
      }
    }

    function installUserGoldBridge() {
      if (installed || !window.UserBaseInfo || typeof window.UserBaseInfo.setUserGold !== "function") {
        return;
      }
      installed = true;

      var originalSetUserGold = window.UserBaseInfo.setUserGold.bind(window.UserBaseInfo);
      var originalGetUserGold = typeof window.UserBaseInfo.getUserGold === "function"
        ? window.UserBaseInfo.getUserGold.bind(window.UserBaseInfo)
        : function () { return 0; };
      var originalSaveUserInfoData = typeof window.UserBaseInfo.saveUserInfoData === "function"
        ? window.UserBaseInfo.saveUserInfoData.bind(window.UserBaseInfo)
        : null;
      var originalOnNotifyEvent = typeof window.UserBaseInfo.onNotifyEvent === "function"
        ? window.UserBaseInfo.onNotifyEvent.bind(window.UserBaseInfo)
        : null;
      var originalGetDayReward = typeof window.UserBaseInfo.getDayReward === "function"
        ? window.UserBaseInfo.getDayReward.bind(window.UserBaseInfo)
        : null;

      window.UserBaseInfo.setUserGold = function patchedSetUserGold(value) {
        var before = toNumber(originalGetUserGold());
        var wasSuppressed = suppressGoldSync;
        var result;
        suppressGoldSync = true;
        try {
          result = originalSetUserGold(value);
        } finally {
          suppressGoldSync = wasSuppressed;
        }
        var after = toNumber(originalGetUserGold());
        updateLocalSaveGold(after);
        if (!wasSuppressed) {
          syncGoldDelta(after - before, nextGoldChangeReason || "");
        }
        lastKnownGold = Math.max(0, Math.floor(after));
        return result;
      };

      if (originalSaveUserInfoData) {
        window.UserBaseInfo.saveUserInfoData = function patchedSaveUserInfoData() {
          var result = originalSaveUserInfoData.apply(window.UserBaseInfo, arguments);
          migrateActiveFishingSaveEconomy();
          mirrorActiveSaveToAccount();
          syncCurrentGold();
          return result;
        };
      }

      if (originalOnNotifyEvent) {
        window.UserBaseInfo.onNotifyEvent = function patchedOnNotifyEvent(callback) {
          return originalOnNotifyEvent(function () {
            var result = callback && callback.apply(this, arguments);
            setTimeout(function () { syncCurrentGold(); }, 0);
            return result;
          });
        };
      }

      if (originalGetDayReward) {
        window.UserBaseInfo.getDayReward = function patchedGetDayReward() {
          if (typeof window.UserBaseInfo.setTadayGetGold === "function") {
            window.UserBaseInfo.setTadayGetGold(true);
          }
          markDailyRewardLocal(0, pendingGold || readCurrentGold() || 0, true);
          return 0;
        };
      }

      if (pendingGold !== null) {
        refreshFishingGold(pendingGold);
      }
    }

    window.onAppMessage = function onAppMessage(message) {
      if (!message) return;
      if (typeof message === "string") {
        try {
          message = JSON.parse(message);
        } catch (error) {
          return;
        }
      }

      var action = message.action;
      var data = message.data || {};
      if (action === "init") {
        resetGoldSyncQueue();
        appInitData = data;
        applyFishingEntryStatus(data);
        lastAccountIdentity = "";
        remoteSaveLoaded = false;
        remoteSaveData = null;
        activateAccountSave();
        loadLocalCastState();
        var loadedSave = loadRemoteSaveSync(true);
        if (loadedSave) {
          applySaveToGame(loadedSave);
        }
        refreshFishingGold(pendingGold !== null ? pendingGold : balanceFromData(data, 0));
        setTimeout(maybeShowFishingEntryFee, 300);
      } else if (action === "balanceUpdate" || action === "pointsChangeResult") {
        var handledGoldSync = action === "pointsChangeResult" && handleGoldSyncResult(data);
        if ((handledGoldSync || action === "balanceUpdate") && (goldSyncInFlight || goldSyncQueue.length)) {
          return;
        }
        if (data.success === false || typeof data.points !== "undefined" || typeof data.balance !== "undefined") {
          refreshFishingGold(balanceFromData(data, pendingGold || 0));
          setTimeout(maybeShowFishingEntryFee, 120);
        }
      }
    };

    installSaveStoragePatch();
    applyFishingEntryStatus(appInitData);
    activateAccountSave();
    loadLocalCastState();
    loadRemoteSaveSync(false);
    updateFishingCastCounter();
    fitCocosCanvasToViewport();
    var fishingCastPatchTimer = setInterval(function () {
      installFishingCastLimitPatch();
      if (fishingCastPatchInstalled) clearInterval(fishingCastPatchTimer);
    }, 20);
    var fishingUiSafetyPatchTimer = setInterval(function () {
      if (installFishingPopWaitPatch()) clearInterval(fishingUiSafetyPatchTimer);
    }, 20);
    window.addEventListener("resize", fitCocosCanvasToViewport);
    window.addEventListener("orientationchange", function () {
      setTimeout(fitCocosCanvasToViewport, 120);
    });
    if (hasRealAccountData()) {
      refreshFishingGold(pendingGold !== null ? pendingGold : balanceFromData(appInitData, 0));
    }
    setInterval(function () {
      fitCocosCanvasToViewport();
      installTextPatch();
      installAdPatch();
      if (!economyPatchInstalled) installEconomyPatch();
      installFishingCastLimitPatch();
      installUserGoldBridge();
      installFishingPopWaitPatch();
      patchFishingMarketDialogs();
      patchFishingPackageDialogs();
      normalizeSceneTextAndAdButtons();
      patchFishingGarbageDialog();
      maybeShowFishingEntryFee();
      updateFishingCastCounter();
      if (!suppressGoldSync) syncCurrentGold();
    }, 300);
  })();
</script>
